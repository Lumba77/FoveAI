      (function() {

                caches.keys().then(function(keys) {
                    keys.forEach(function(key) {
                        caches.delete(key);
                    });

            }
            if (navigator.serviceWorker) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    registrations.forEach(function(reg) {
                        reg.unregister();
                    });
                });
            }
            try { window.sessionStorage.clear(); } catch(e) {}
            urlParams.set('v', expectedVersion);
            window.location.search = urlParams.toString();
        }
      })();

    <script data-cfasync="false">
      // REGISTER THE NO-CACHE PWA SERVICE WORKER (For stable installability without caching hangs!)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[PWA] ServiceWorker registered with scope:', reg.scope))
          .catch(err => console.error('[PWA] ServiceWorker registration failed:', err));
      }

      // ATOMIC BOOT LOGIC
      window.CACHE_BUSTER_VERSION = "512";
      window.log = (msg, color = "#00f3ff") => {
        try {
            const logDiv = document.getElementById('boot-log-content');
            const header = document.getElementById('boot-log-header');
            const logContainer = document.getElementById('boot-log');

            if (logDiv) {
                // Check for errors to trigger glow
      const isError = color === "#ff007f" || (typeof msg === 'string' && (msg.includes('ERROR') || msg.includes('FATAL') || msg.includes('❌') || msg.includes('🚨')));
                if (isError && logContainer.classList.contains('minimized')) {
                    header.classList.add('glow-error');
                }

                // UI OPTIMIZATION: Update percentage lines in-place
                const isProgressLine = typeof msg === 'string' && msg.includes('%');
                let existingEntry = null;

                if (isProgressLine) {
                    const prefix = msg.split(':')[0]; 
                    existingEntry = Array.from(logDiv.childNodes).find(el => el.innerText && el.innerText.startsWith(prefix));
                }

                if (existingEntry) {
                    existingEntry.innerText = msg;
                    existingEntry.style.color = color;
                } else {
                    const entry = document.createElement('div');
                    entry.innerText = msg; 
                    entry.style.color = color;
                    logDiv.appendChild(entry);
                }

                if (logDiv.childNodes.length > 100) logDiv.removeChild(logDiv.firstChild);
                logDiv.scrollTop = logDiv.scrollHeight;
            }
            console.log(`[BOOT] ${msg}`);

            // DEFENSIVE PROGRESS PARSING
            if (typeof msg === 'string' && (msg.includes('Brain:') || msg.includes('Avatar Load:') || msg.includes('Brain Init:') || msg.includes('SYSTEM SOVEREIGN ACTIVE'))) {
                // Use robust Regex to extract percentage
                const pctMatch = msg.match(/(\d+)%/);
                const percentValue = pctMatch ? parseInt(pctMatch[1]) : 0;
                
                // Use robust Regex to extract status text
                let statusStr = 'Synchronizing...';
                if (msg.includes('Brain:')) statusStr = 'Warming Brain';
                else if (msg.includes('Avatar Load:')) statusStr = 'Manifesting Avatar';
                else if (msg.includes('Brain Init:')) statusStr = 'Initializing Neural Link';
                else if (msg.includes('SYSTEM SOVEREIGN ACTIVE')) statusStr = 'Sovereign Active';

                const bar = document.getElementById('progress-bar');
                const statusEl = document.getElementById('loading-status');

                // If we reach SYSTEM SOVEREIGN ACTIVE, force progress to 100%
                const finalPercent = msg.includes('SYSTEM SOVEREIGN ACTIVE') ? 100 : percentValue;

                if (bar) bar.style.width = finalPercent + '%';
                if (statusEl) statusEl.innerText = `Neural Link: ${statusStr} (${finalPercent}%)`;

                if (finalPercent >= 100 || msg.includes('SYSTEM SOVEREIGN ACTIVE')) {
                    setTimeout(() => {
                        const ls = document.getElementById('loading-screen');
                        if (ls) {
                            ls.classList.add('hidden');
                            console.log('[Boot] Loading screen cleared.');
                        }
                    }, 1000);
                }
            }
        } catch (err) {
            console.error('[Boot] Progress Parser Failed (Bypassed):', err);
        }
      };

      // CRASH PROTOCOL
      window.addEventListener('error', (e) => {
        // Ignore resource loading errors (target is element, not window)
        if (e.target && e.target !== window) return;

        const error = e.error || { message: e.message };
        const msg = error.message || 'Unknown Runtime Error';
        const stack = error.stack || 'No Trace';
        
        window.log(`FATAL: ${msg}`, "#ff007f");
        // Print surgical trace to screen
        const trace = stack.split('\n')[1] || stack.substring(0, 100);
        window.log(`AT: ${trace}`, "#ff007f");
        
        console.error('System Terminal Failure:', error);
      }, true);

      window.addEventListener('unhandledrejection', (e) => {
        const reason = e.reason?.message || e.reason || 'Unknown Async Fault';
        const stack = e.reason?.stack || 'No Stack Available';
        window.log(`ASYNC ERROR: ${reason}`, "#ff007f");
        console.error('Unhandled Promise Rejection:', e.reason);
        console.error('Stack:', stack);
      });

      window.onerror = (msg, url, line, col, error) => {
        const errorMsg = `FAULT: ${msg} @ ${line}:${col}`;
        window.log(errorMsg, '#ff007f');
        if (error?.stack) console.error('Stack:', error.stack);
        return false;
      };

      window.log('Requesting Module: main.ts...');
    </script>

    <script data-cfasync="false">
      // Ignition handler: button press unlocks audio AND fires the reactor spin-up,
      // then fades the dark room away — the garage lights up.
      (function() {
        var overlay = document.getElementById('lumax-tap-overlay');
        var btn = document.getElementById('ign-btn');
        var status = document.getElementById('ign-status');
        var vrlog = document.getElementById('ign-vrlog');
        if (!overlay || !btn) return;
        var ignited = false;

        function log(t) { vrlog.innerHTML += t + '<br>'; vrlog.scrollTop = vrlog.scrollHeight; }

        function playClick() {
          try {
            var ctx = window._lumaxAudioCtx;
            if (!ctx) return;
            var t = ctx.currentTime;
            var o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'square';
            o.frequency.setValueAtTime(180, t);
            o.frequency.exponentialRampToValueAtTime(60, t + 0.09);
            g.gain.setValueAtTime(0.3, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            o.connect(g); g.connect(ctx.destination);
            o.start(t); o.stop(t + 0.13);
            var hum = ctx.createOscillator(), hg = ctx.createGain(), lp = ctx.createBiquadFilter();
            hum.type = 'sawtooth';
            hum.frequency.setValueAtTime(38, t + 0.1);
            hum.frequency.linearRampToValueAtTime(92, t + 3.0);
            lp.type = 'lowpass'; lp.frequency.value = 300;
            hg.gain.setValueAtTime(0.0001, t + 0.1);
            hg.gain.exponentialRampToValueAtTime(0.1, t + 2.0);
            hg.gain.exponentialRampToValueAtTime(0.001, t + 4.2);
            hum.connect(lp); lp.connect(hg); hg.connect(ctx.destination);
            hum.start(t + 0.1); hum.stop(t + 4.3);
          } catch(e) {}
        }

        function dismissOverlay() {
          if (ignited) return;
          ignited = true;

          // Unlock AudioContext during user gesture (required by Chrome/Quest 3)
          try {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              if (!window._lumaxAudioCtx) {
                window._lumaxAudioCtx = new AudioCtx();
              }
              if (window._lumaxAudioCtx.state === 'suspended') {
                window._lumaxAudioCtx.resume();
              }
            }
          } catch(e) { console.warn('[Ignition] AudioContext unlock error:', e); }

          playClick();

          // Reactor visuals: red → green, orbits spin
          btn.style.color = '#4ade80'; btn.style.borderColor = '#4ade80';
          btn.style.textShadow = '0 0 12px #4ade80';
          btn.style.background = 'radial-gradient(circle at 38% 32%,rgba(74,222,128,.25),rgba(74,222,128,.06) 55%,rgba(0,0,0,.6))';
          btn.style.boxShadow = '0 0 70px rgba(74,222,128,.55),inset 0 0 40px rgba(74,222,128,.3)';
          btn.style.animation = 'none'; btn.textContent = 'SPIN UP';
          btn.disabled = true; btn.style.cursor = 'default';
          document.getElementById('ign-orbit').style.cssText += 'border-color:rgba(74,222,128,.5);animation:ign-spin 6s linear infinite;';
          document.getElementById('ign-orbit2').style.cssText += 'border-color:rgba(74,222,128,.3);animation:ign-spin 11s linear infinite reverse;';
          status.textContent = 'reactor spinning up…'; status.style.color = '#4ade80';
          log('◈ thorium lattice energized');
          setTimeout(function() { log('◈ helium circulators online'); }, 700);
          setTimeout(function() { log('◈ core nominal — welcome back'); btn.textContent = 'ONLINE'; }, 1600);

          // We no longer grab the mic here. Grabbing it immediately before WebXR starts
          // causes the Quest browser to glitch and swallow the permission prompt!
          // We will request the mic from inside main.ts AFTER the WebXR session is active.
          var silentAudio = document.getElementById('lumax-silent-loop');
          if (silentAudio) silentAudio.play().catch(function(e) { console.warn(e); });

          // Also unlock via AuralAwareness if already loaded
          try {
            if (window.lumaxAudio && window.lumaxAudio.unlockAudio) {
              window.lumaxAudio.unlockAudio();
            }
          } catch(e) { console.warn('[Ignition] AuralAwareness unlock error:', e); }

          // Lights up: warm flash through the room, then the dark room fades out
          overlay.style.background = 'radial-gradient(900px 700px at 50% 50%,rgba(255,200,80,0.35),rgba(30,22,10,.95) 75%)';
          setTimeout(function() {
            overlay.style.transition = 'opacity 1.1s ease';
            overlay.style.opacity = '0';
            setTimeout(function() {
              if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
            }, 1100);
          }, 2200);

          console.log('[Ignition] Core online — audio unlocked, lights up');
          btn.removeEventListener('click', dismissOverlay);
          btn.removeEventListener('touchend', dismissOverlay);
        }

        btn.addEventListener('click', dismissOverlay);
        btn.addEventListener('touchend', dismissOverlay);
      })();

        background: rgba(0,243,255,0.15);
        border-color: #00f3ff;
        color: #00f3ff;
        text-shadow: 0 0 6px rgba(0,243,255,0.4);
      }

      /* Glass cards more compact on phone */
      @media (max-width: 768px) {
        .glass-card {
          padding: 12px !important;
          margin-bottom: 10px !important;
          font-size: 0.75rem !important;
        }

        .header {
          padding: 10px 14px !important;
        }

        .title {
          font-size: 1rem !important;
          letter-spacing: 1px !important;
        }

        .title-tagline {
          font-size: 0.6rem !important;
        }
      }
    </style>
    <!-- ── PHONE MODE ELEMENTS (hidden on desktop, shown on Android APK) ── -->
    <div class="phone-avatar-bar" id="phone-avatar-bar">
      <div class="phone-avatar-label">LUMAX</div>
    </div>
    <div class="phone-controls-bar" id="phone-controls-bar">
      <div class="phone-ctrl-group">
        <button class="phone-ctrl-btn mute" id="phone-btn-mute" title="Mute Audio">🎤</button>
        <div class="phone-ctrl-label">MUTE</div>
      </div>
      <div class="phone-ctrl-group">
        <button class="phone-ctrl-btn camera" id="phone-btn-camera" title="Capture Photo">📷</button>
        <div class="phone-ctrl-label">PHOTO</div>
      </div>
      <div class="phone-ctrl-group">
        <button class="phone-ctrl-btn hangup" id="phone-btn-hangup" title="Pause Agent">⏻</button>
        <div class="phone-ctrl-label">PAUSE</div>
      </div>
    </div>
    <div class="phone-tab-nav" id="phone-tab-nav">
      <button class="phone-tab-pill active" data-tab="chat">💬 Chat</button>
      <button class="phone-tab-pill" data-tab="agency">⚡ Agency</button>
      <button class="phone-tab-pill" data-tab="vision">👁 Vision</button>
      <button class="phone-tab-pill" data-tab="settings">⚙ Settings</button>
    </div>
    <div class="phone-menu-area" id="phone-menu-area">
      <!-- Tab content rendered here by main.ts -->
    </div>

    <script data-cfasync="false">
      // ── PHONE MODE DETECTION & ACTIVATION ─────────────────
      (function() {
        // Check if running inside Lumax Phone APK (native bridge available)
        function detectPhoneMode() {
          // Method 1: Native bridge injected by Android WebView
          if (window.__LumaxNativeAvailable || (window.LumaxNative && window.LumaxNative.getPlatform)) {
            return true;
          }
          // Method 2: User-Agent hint (Android WebView)
          if (navigator.userAgent.includes('Android') && navigator.userAgent.includes('wv')) {
            return true;
          }
          // Method 3: Screen size heuristic (phone-sized, no WebXR support)
          if (window.innerWidth < 768 && !navigator.xr) {
            return true;
          }
          return false;
        }

        function activatePhoneMode() {
          document.body.classList.add('phone-mode');
          window.log?.('[Phone Mode] Mobile layout activated', '#39ff14');

          // Move the Three.js canvas into the avatar bar if it exists
          const avatarBar = document.getElementById('phone-avatar-bar');
          const appDiv = document.getElementById('app');

          // Observe for canvas creation (Three.js renders into #app)
          const observer = new MutationObserver(() => {
            const canvas = appDiv?.querySelector('canvas');
            if (canvas && avatarBar && canvas.parentElement !== avatarBar) {
              // Clone the canvas into the avatar bar (keep original for 3D context)
              // Actually, we just position the canvas to show the face
              avatarBar.appendChild(canvas);
              canvas.style.width = '100%';
              canvas.style.height = '100%';
              canvas.style.position = 'absolute';
              canvas.style.top = '0';
              canvas.style.left = '0';
              window.log?.('[Phone Mode] Avatar canvas moved to face bar', '#00f3ff');
              observer.disconnect();
            }
          });
          if (appDiv) observer.observe(appDiv, { childList: true, subtree: true });
          setTimeout(() => observer.disconnect(), 10000); // Stop after 10s

          // ── Control button handlers ──────────────────────
          const btnMute = document.getElementById('phone-btn-mute');
          const btnCamera = document.getElementById('phone-btn-camera');
          const btnHangup = document.getElementById('phone-btn-hangup');

          let isMuted = false;
          btnMute?.addEventListener('click', () => {
            isMuted = !isMuted;
            btnMute.classList.toggle('active', isMuted);
            btnMute.textContent = isMuted ? '🔇' : '🎤';
            // Toggle speech synthesis
            if (isMuted) {
              speechSynthesis.cancel();
            }
            window.dispatchEvent(new CustomEvent('lumax_phone_mute', { detail: { muted: isMuted } }));
            window.log?.('[Phone] ' + (isMuted ? 'Muted' : 'Unmuted'), isMuted ? '#ff007f' : '#39ff14');
          });

          btnCamera?.addEventListener('click', () => {
            btnCamera.classList.add('active');
            setTimeout(() => btnCamera.classList.remove('active'), 300);
            // Try native camera first, fallback to file input
            if (window.LumaxNative?.capturePhoto) {
              window.__lumaxCallbacks = window.__lumaxCallbacks || {};
              window.__lumaxCallbacks['phone_photo'] = (base64) => {
                window.dispatchEvent(new CustomEvent('lumax_photo_captured', { detail: { base64 } }));
                window.log?.('[Phone] Photo captured via native camera', '#39ff14');
              };
              window.LumaxNative.capturePhoto('phone_photo');
            } else {
              // Fallback: create a file input for camera capture
              const input = document.createElement('input');
              input.type = 'file';
              input.accept = 'image/*';
              input.capture = 'environment';
              input.onchange = (e) => {
                const target = e.target;
                const file = (target && target.files) ? target.files[0] : null;
                if (file) {
                  const reader = new FileReader();
                  reader.onload = (ev) => {
                    const resultString = (ev.target && ev.target.result) ? ev.target.result : '';
                    const base64 = resultString.split(',')[1] || '';
                    window.dispatchEvent(new CustomEvent('lumax_photo_captured', { detail: { base64 } }));
                    window.log?.('[Phone] Photo captured via browser', '#39ff14');
                  };
                  reader.readAsDataURL(file);
                }
              };
              input.click();
            }
          });

          btnHangup?.addEventListener('click', () => {
            // Pause/resume agent loop
            const isPaused = btnHangup.textContent === '▶';
            btnHangup.textContent = isPaused ? '⏻' : '▶';
            btnHangup.style.borderColor = isPaused ? '#ff007f' : '#39ff14';
            btnHangup.style.color = isPaused ? '#ff007f' : '#39ff14';
            window.dispatchEvent(new CustomEvent('lumax_phone_pause', { detail: { paused: !isPaused } }));
            window.log?.('[Phone] Agent ' + (isPaused ? 'resumed' : 'paused'), isPaused ? '#39ff14' : '#ff007f');
          });

          // ── Tab pill navigation ──────────────────────────
          const tabPills = document.querySelectorAll('.phone-tab-pill');
          tabPills.forEach(pill => {
            pill.addEventListener('click', () => {
              tabPills.forEach(p => p.classList.remove('active'));
              pill.classList.add('active');
              const tabName = pill.getAttribute('data-tab');
              window.dispatchEvent(new CustomEvent('lumax_phone_tab', { detail: { tab: tabName } }));
              window.log?.('[Phone] Tab: ' + tabName, '#00f3ff');
            });
          });
        }

        // Activate immediately if detected, or listen for native bridge
        if (detectPhoneMode()) {
          activatePhoneMode();
        } else {
          // Listen for native bridge injection (delayed in WebView)
          window.addEventListener('lumax_native_ready', () => {
            window.log?.('[Phone] Native bridge detected — activating phone mode', '#39ff14');
            activatePhoneMode();
          }, { once: true });
        }
      })();

      // ── TELEMETRY PURGER: Remove telemetry text from DOM rendering completely ──
      (function() {
        function purgeTelemetry() {
          try {
            const bodyChildren = Array.from(document.body.childNodes);
            bodyChildren.forEach(node => {
              if (node.id === 'app' || node.id === 'loading-screen' || node.id === 'boot-log' || node.id === 'lumax-tap-overlay' || node.id === 'lumax-dashboard' || node.tagName === 'SCRIPT' || node.tagName === 'STYLE') return;
              const txt = node.textContent || '';
              if (txt.includes('1280x720') || txt.includes('2a00:') || txt.includes('SEKista') || txt.includes('SEStockholm') || (txt.includes('multigate') && txt.includes('1280'))) {
                window.LUMAX_TELEMETRY = txt.trim();
                try { node.remove(); } catch(e) {}
              }
            });
          } catch(e) {}
        }
        window.addEventListener('DOMContentLoaded', purgeTelemetry);
        setInterval(purgeTelemetry, 500);
      })();
    </script>
    <script data-cfasync="false" type="module" crossorigin src="/src/main.ts?v=514"></script>
