<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Force HTTPS for WebXR context — only for real domain names that can
      // terminate TLS (xarel.net etc). IP literals and .local have no TLS
      // endpoint, so upgrading would break LAN access; also keep the port.
      var _isLocal = /^(localhost|127\.0\.0\.1|(\d{1,3}\.){3}\d{1,3}|\[.*\])$/.test(location.hostname) || location.hostname.endsWith('.local');
      if (location.protocol === 'http:' && !_isLocal) {
        location.replace(`https://${location.host}${location.pathname}${location.search}`);
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>multigate</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
        overflow: hidden !important;
        position: fixed;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="lumax-fallback" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#050510; color:#00f3ff; font-family:monospace; padding:20px; z-index:10000; white-space:pre-wrap; overflow:auto;"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // ── TELEMETRY PURGER: Remove telemetry text from DOM rendering and keep offside ──
      (function() {
        function purgeTelemetry() {
          try {
            const bodyChildren = Array.from(document.body.childNodes);
            bodyChildren.forEach(node => {
              if (node.id === 'root' || node.tagName === 'SCRIPT' || node.tagName === 'STYLE') return;
              const txt = node.textContent || '';
              if (txt.includes('1280x720') || txt.includes('2a00:') || txt.includes('SEKista') || txt.includes('SEStockholm') || (txt.includes('multigate') && txt.includes('1280'))) {
                window.LUMAX_TELEMETRY = txt.trim();
                try { node.remove(); } catch(e) {}
              }
            });
          } catch(e) {}
        }
        window.addEventListener('DOMContentLoaded', purgeTelemetry);
        setInterval(purgeTelemetry, 500);
      })();
    </script>
    <script>
      (function() {
        const fallback = document.getElementById('lumax-fallback');
        function showError(msg) {
          if (!fallback) return;
          fallback.style.display = 'block';
          fallback.textContent = '🐛 Something went while loading the page.\n\n' + msg + '\n\nTry Ctrl + F5 to reload fresh.\nIf the problem stays, check the browser console (F12 → Console) and report the red text.';
        }
        window.onerror = function(message, source, lineno, colno, error) {
          showError(String(message) + ' at ' + source + ':' + lineno + ':' + colno + (error ? '\n' + String(error.stack || error) : ''));
          return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
          showError('Unhandled Promise: ' + String(event.reason && (event.reason.stack || event.reason.message || event.reason)));
        });
        const origError = console.error;
        const origWarn = console.warn;
        let errorBuffer = [];
        function pushError(level, args) {
          try {
            errorBuffer.push('[' + level + '] ' + Array.from(args).map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
            if (errorBuffer.length > 5) errorBuffer.shift();
            showError(errorBuffer.join('\n'));
          } catch(e) {}
        }
        console.error = function(...args) { pushError('ERROR', args); origError.apply(console, args); };
        console.warn = function(...args) { pushError('WARN', args); origWarn.apply(console, args); };
      })();
    </script>
  </body>
</html>
