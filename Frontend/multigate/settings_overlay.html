<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XRLF 3.0 Spatial Machine — Settings</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #121a30;
    --accent: #00f0ff;
    --accent-dim: #0a8a99;
    --text: #e6f0ff;
    --muted: #8aa0c0;
    --danger: #ff4d6d;
    --ok: #22c55e;
    --border: rgba(0, 240, 255, 0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Inter", system-ui, sans-serif;
    overflow: hidden;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(2, 6, 20, 0.78);
    backdrop-filter: blur(8px);
    z-index: 9999;
  }
  #overlay.visible { display: flex; }
  .panel {
    width: min(720px, 92vw);
    max-height: 86vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.12);
    padding: 24px 28px;
  }
  h1 {
    font-size: 20px;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    color: var(--accent);
  }
  .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .section { margin-bottom: 22px; }
  .section h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    gap: 12px;
  }
  .row label { font-size: 14px; flex: 1; }
  .row .value { color: var(--muted); font-size: 12px; }
  input[type="text"], select {
    background: #0a1124;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    width: 220px;
  }
  .toggle {
    position: relative;
    width: 44px;
    height: 24px;
    background: #1a2540;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s;
    border: 1px solid var(--border);
  }
  .toggle.on { background: var(--accent-dim); }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    background: var(--text);
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(20px); }
  .status-dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 8px;
    background: var(--muted);
  }
  .status-dot.online { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .status-dot.offline { background: var(--danger); }
  .btn {
    background: var(--accent-dim);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--accent); color: #001018; }
  .btn.danger { background: #3a1020; }
  .btn.danger:hover { background: var(--danger); color: #fff; }
  .footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .persona-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
  }
  .persona-card {
    background: #0a1124;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .persona-card:hover { border-color: var(--accent); }
  .persona-card.active { border-color: var(--accent); background: #0d1a30; }
  .persona-card .name { font-size: 13px; font-weight: 600; }
  .persona-card .emotion { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<div id="overlay">
  <div class="panel">
    <h1>🦋 XRLF 3.0 Spatial Machine</h1>
    <div class="subtitle">Unified Cognitive Engine — Settings Overlay</div>

    <div class="section">
      <h2>Connection</h2>
      <div class="row">
        <label><span class="status-dot" id="statusDot"></span>Backend Status</label>
        <span class="value" id="statusText">Connecting…</span>
      </div>
      <div class="row">
        <label>WebSocket URL</label>
        <input type="text" id="wsUrl" value="ws://127.0.0.1:8000" />
      </div>
      <div class="row">
        <label>XRLF Version</label>
        <span class="value" id="xrlfVersion">—</span>
      </div>
    </div>

    <div class="section">
      <h2>Avatar</h2>
      <div class="row">
        <label>Companion Model</label>
        <span class="value">Alicechan.vrm</span>
      </div>
      <div class="row">
        <label>Auto-Load Avatar on Boot</label>
        <div class="toggle on" id="toggleAvatarLoad" onclick="toggleSwitch(this)"></div>
      </div>
      <div class="row">
        <label>Blendshape Emotion Driver</label>
        <div class="toggle on" id="toggleEmotion" onclick="toggleSwitch(this)"></div>
      </div>
    </div>

    <div class="section">
      <h2>Persona</h2>
      <div class="persona-grid" id="personaGrid">Loading…</div>
    </div>

    <div class="section">
      <h2>XR Mode</h2>
      <div class="row">
        <label>Default Runtime</label>
        <select id="xrMode">
          <option value="passthrough" selected>Meta Quest 3 Passthrough (WebXR)</option>
          <option value="desktop">Desktop WebApp Fallback</option>
        </select>
      </div>
      <div class="row">
        <label>Foveated Memory (FTS5)</label>
        <div class="toggle on" id="toggleMemory" onclick="toggleSwitch(this)"></div>
      </div>
    </div>

    <div class="footer">
      <button class="btn danger" onclick="hideOverlay()">Close</button>
      <button class="btn" onclick="applySettings()">Apply</button>
    </div>
    <div class="hint">Summon this panel via Quest 3 controller menu button or desktop keyboard shortcut (Shift+M).</div>
  </div>
</div>

<script>
  const overlay = document.getElementById('overlay');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const xrlfVersion = document.getElementById('xrlfVersion');
  const personaGrid = document.getElementById('personaGrid');
  let ws = null;
  let personas = [];
  let activePersona = '';

  function showOverlay() { overlay.classList.add('visible'); connect(); }
  function hideOverlay() { overlay.classList.remove('visible'); }

  function toggleSwitch(el) { el.classList.toggle('on'); }

  // Summon via Shift+M on desktop browsers
  document.addEventListener('keydown', (e) => {
    if (e.shiftKey && (e.key === 'M' || e.key === 'm')) {
      if (overlay.classList.contains('visible')) hideOverlay();
      else showOverlay();
    }
  });

  // Expose for Quest 3 controller bindings (Unity WebView bridge)
  window.XRLFSettings = { show: showOverlay, hide: hideOverlay, toggle: () => overlay.classList.contains('visible') ? hideOverlay() : showOverlay() };

  function connect() {
    const url = document.getElementById('wsUrl').value || 'ws://127.0.0.1:8000';
    try { if (ws) ws.close(); } catch (e) {}
    statusText.textContent = 'Connecting…';
    statusDot.className = 'status-dot';
    ws = new WebSocket(url);
    ws.onopen = () => {
      statusDot.className = 'status-dot online';
      statusText.textContent = 'Online';
      sendEvent('health', {});
      sendEvent('persona.list', {});
    };
    ws.onclose = () => {
      statusDot.className = 'status-dot offline';
      statusText.textContent = 'Offline';
    };
    ws.onerror = () => {
      statusDot.className = 'status-dot offline';
      statusText.textContent = 'Error';
    };
    ws.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.xrlf_version) xrlfVersion.textContent = msg.xrlf_version;
        if (msg.event === 'health' && msg.payload) {
          xrlfVersion.textContent = msg.payload.xrlf_version || '3.0';
        }
        if (msg.event === 'persona.list' && msg.payload) {
          personas = msg.payload.personas || [];
          renderPersonas();
        }
        if (msg.event === 'persona.switched' && msg.payload) {
          activePersona = msg.payload.persona_id;
          renderPersonas();
        }
      } catch (e) { console.warn('Parse error', e); }
    };
  }

  function sendEvent(event, payload) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ xrlf_version: '3.0', event, payload }));
    }
  }

  function renderPersonas() {
    personaGrid.innerHTML = '';
    personas.forEach(p => {
      const card = document.createElement('div');
      card.className = 'persona-card' + (p.id === activePersona ? ' active' : '');
      card.innerHTML = `<div class="name">${p.name}</div><div class="emotion">${p.baseline_emotion} · ${p.response_style}</div>`;
      card.onclick = () => { activePersona = p.id; sendEvent('persona.switch', { persona_id: p.id }); renderPersonas(); };
      personaGrid.appendChild(card);
    });
  }

  function applySettings() {
    // Persist locally
    localStorage.setItem('xrlf_ws_url', document.getElementById('wsUrl').value);
    localStorage.setItem('xrlf_xr_mode', document.getElementById('xrMode').value);
    localStorage.setItem('xrlf_avatar_autoload', document.getElementById('toggleAvatarLoad').classList.contains('on'));
    localStorage.setItem('xrlf_emotion_driver', document.getElementById('toggleEmotion').classList.contains('on'));
    localStorage.setItem('xrlf_memory_fts5', document.getElementById('toggleMemory').classList.contains('on'));
    hideOverlay();
  }

  // Restore saved settings
  (function restore() {
    const savedUrl = localStorage.getItem('xrlf_ws_url');
    if (savedUrl) document.getElementById('wsUrl').value = savedUrl;
    const savedMode = localStorage.getItem('xrlf_xr_mode');
    if (savedMode) document.getElementById('xrMode').value = savedMode;
  })();
</script>
</body>
</html>
