<div style="display: flex; flex-direction: column; height: 100%; font-family: monospace;">
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">
        Monetization engine — agent management, idea scanning, treasury configuration.
        Proxied through Soul Core (port 8000) via xr_app.py.
        <span style="color: var(--status-ok);" id="monetize-conn-status">● Checking...</span>
    </p>

    <!-- Status Cards -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem;">
        <div style="background: rgba(255,215,0,0.05); border: 1px solid rgba(255,215,0,0.2); border-radius: 4px; padding: 8px;">
            <div style="font-size: 0.6rem; color: #ffd700; letter-spacing: 0.1em;">TREASURY</div>
            <div style="font-size: 0.9rem; color: #fff; margin-top: 4px;" id="monetize-treasury-status">checking...</div>
        </div>
        <div style="background: rgba(0,243,255,0.05); border: 1px solid rgba(0,243,255,0.2); border-radius: 4px; padding: 8px;">
            <div style="font-size: 0.6rem; color: #00f3ff; letter-spacing: 0.1em;">AGENTS</div>
            <div style="font-size: 0.9rem; color: #fff; margin-top: 4px;" id="monetize-agent-count">0</div>
        </div>
        <div style="background: rgba(57,255,20,0.05); border: 1px solid rgba(57,255,20,0.2); border-radius: 4px; padding: 8px;">
            <div style="font-size: 0.6rem; color: #39ff14; letter-spacing: 0.1em;">IDEAS</div>
            <div style="font-size: 0.9rem; color: #fff; margin-top: 4px;" id="monetize-idea-count">0</div>
        </div>
        <div style="background: rgba(255,0,127,0.05); border: 1px solid rgba(255,0,127,0.2); border-radius: 4px; padding: 8px;">
            <div style="font-size: 0.6rem; color: #ff007f; letter-spacing: 0.1em;">CERTIFIED</div>
            <div style="font-size: 0.9rem; color: #fff; margin-top: 4px;" id="monetize-certified-count">0</div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div style="display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap;">
        <button class="primary-btn" style="flex: 1; min-width: 100px; background: rgba(255,215,0,0.1); border-color: #ffd700; color: #ffd700;" id="monetize-scan-ideas">🔍 SCAN IDEAS</button>
        <button class="primary-btn" style="flex: 1; min-width: 100px; background: rgba(57,255,20,0.1); border-color: #39ff14; color: #39ff14;" id="monetize-certify-idea">📜 CERTIFY</button>
        <button class="primary-btn" style="flex: 1; min-width: 100px; background: rgba(0,243,255,0.1); border-color: #00f3ff; color: #00f3ff;" id="monetize-refresh">⟳ REFRESH</button>
    </div>

    <!-- Idea Input -->
    <div style="display: flex; gap: 8px; margin-bottom: 1rem;">
        <input type="text" id="monetize-idea-input" class="text-input" placeholder="Idea ID to certify..." style="flex: 1; font-family: monospace;">
    </div>

    <!-- Results Area -->
    <div id="monetize-results" style="
        flex: 1;
        background: #02050a;
        border: 1px solid rgba(255, 215, 0, 0.2);
        border-radius: 4px;
        padding: 1rem;
        overflow-y: auto;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 0.8rem;
        color: #ffd700;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    ">
        <div style="color: #888;">Ready. Click SCAN IDEAS to discover monetization opportunities.</div>
    </div>
</div>

<script>
(function() {
    const BASE = '';
    const results = document.getElementById('monetize-results');

    function log(text, type = 'INFO') {
        const line = document.createElement('div');
        line.style.marginBottom = '4px';
        let color = '#ffd700';
        if (type === 'ERROR') color = '#f44336';
        if (type === 'SUCCESS') color = '#39ff14';
        if (type === 'DATA') color = '#00f3ff';
        line.innerHTML = `<span style="color: ${color};">[${type}]</span> ${text}`;
        results.appendChild(line);
        results.scrollTop = results.scrollHeight;
    }

    async function apiGet(path) {
        const r = await fetch(`${BASE}${path}`, { signal: AbortSignal.timeout(5000) });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
    }

    async function apiPost(path, body = {}) {
        const r = await fetch(`${BASE}${path}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            signal: AbortSignal.timeout(10000)
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
    }

    async function refreshStatus() {
        try {
            const status = await apiGet('/api/monetize/status');
            document.getElementById('monetize-conn-status').textContent = '● Connected';
            document.getElementById('monetize-conn-status').style.color = '#2ecc71';
            document.getElementById('monetize-treasury-status').textContent = status.treasury || 'active';
            document.getElementById('monetize-agent-count').textContent = status.agent_count || 0;
            document.getElementById('monetize-idea-count').textContent = status.idea_count || 0;
            document.getElementById('monetize-certified-count').textContent = status.certified_count || 0;
        } catch (e) {
            document.getElementById('monetize-conn-status').textContent = '■ Offline';
            document.getElementById('monetize-conn-status').style.color = '#ff4444';
            log(`Cannot reach monetize API: ${e.message}`, 'ERROR');
        }
    }

    document.getElementById('monetize-scan-ideas')?.addEventListener('click', async () => {
        log('Scanning for monetization ideas...', 'INFO');
        try {
            const data = await apiPost('/api/monetize/ideas/scan');
            log(`Scan complete: ${data.ideas?.length || 0} ideas found`, 'SUCCESS');
            if (data.ideas) {
                data.ideas.forEach(idea => {
                    log(`  • ${idea.id}: ${idea.title || idea.description}`, 'DATA');
                });
            }
            refreshStatus();
        } catch (e) {
            log(`Scan failed: ${e.message}`, 'ERROR');
        }
    });

    document.getElementById('monetize-certify-idea')?.addEventListener('click', async () => {
        const ideaId = document.getElementById('monetize-idea-input').value.trim();
        if (!ideaId) {
            log('Enter an idea ID to certify', 'ERROR');
            return;
        }
        log(`Certifying idea: ${ideaId}...`, 'INFO');
        try {
            const data = await apiPost('/api/monetize/ideas/certify', { idea_id: ideaId });
            log(`Certified: ${JSON.stringify(data)}`, 'SUCCESS');
            refreshStatus();
        } catch (e) {
            log(`Certify failed: ${e.message}`, 'ERROR');
        }
    });

    document.getElementById('monetize-refresh')?.addEventListener('click', refreshStatus);

    // Initial load
    refreshStatus();
})();
</script>
