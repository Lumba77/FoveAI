<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Offline</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #05050b;
            color: #e0e0e5;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .box {
            max-width: 520px;
            padding: 2rem;
            border: 1px solid #333;
            border-radius: 12px;
            background: #0f0f16;
        }
        h1 { font-family: 'Orbitron', sans-serif; color: #ff4d4d; }
        p { line-height: 1.6; color: #aaa; }
        .port { color: #00d4aa; font-weight: bold; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="http://127.0.0.1:8415/foveai_theme_sync.js"></script>
</head>
<body>
    <div class="box">
        <h1>Service Offline</h1>
        <p>This domain is not active right now. The other LUMAX domain is running on the shared <span class="port">8080</span> web server.</p>
        <p>Switch the active site from the system tray to wake this one up.</p>
    </div>
</body>
</html>
