api:
  host: 0.0.0.0
  port: 8402
  dashboard_port: 8414
gguf_source: lumax-summarizer-draft.gguf
gpu_layers: -1
memory:
  tfidf_top_k: 5
  token_budget: 2048
memory_db_source: ''
model: xrl_encoded/smolvlm2-500m-multimodal-v1.0.xrlf
models:
  primary: xrl_encoded/smolvlm2-500m-multimodal-v1.0.xrlf
  secondary: xrl_encoded/qwopus3.5-9b-coder-mtp-moq.xrlf
summarizer:
  enabled: true
  model: foveai-summarizer-draft.gguf
  engine: xrlf_runtime
  endpoint: http://127.0.0.1:8402/v1
  max_tokens: 512
  temperature: 0.3
n_ctx: 16384
session:
  id: default
  persistent_memory: true
tts:
  enabled: true
  endpoint: http://127.0.0.1:8402/v1/audio/speech
  engine: auto
  fallback:
  - http
  - kokoro
  - piper
  - espeak
  - stub
  provider: http
  voice: default
stt:
  enabled: true
  engine: auto
  # Native STT via XRLF model (Gemma 12B) or external Whisper hook (Qwen 4B)
  # When the XRLF model has STT_NATIVE flag, audio is sent directly to :8402
  # When using external hook, Whisper runs as a hook inside the XRLF runtime
  endpoint: http://127.0.0.1:8402/v1/audio/transcriptions
  fallback:
  - native
  - whisper
  - stub
vision:
  enabled: true
  endpoint: http://127.0.0.1:8402/v1/images/understand
xrl:
  profile_auto_detect: true
  steering_strength: 0.8
  verbose: false