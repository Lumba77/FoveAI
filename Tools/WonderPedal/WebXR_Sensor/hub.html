<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMAX Voice Hub</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #mic-container {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.2), 
                        inset 10px 10px 20px rgba(255,255,255,0.05), 
                        inset -10px -10px 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #mic-container.listening {
            box-shadow: 0 0 80px rgba(0, 255, 150, 0.5), 
                        inset 10px 10px 20px rgba(255,255,255,0.1), 
                        inset -10px -10px 20px rgba(0,0,0,0.5);
            animation: pulse 1.5s infinite;
        }

        #mic-container.error {
            box-shadow: 0 0 80px rgba(255, 50, 50, 0.5);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #mic-icon {
            font-size: 80px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        #status {
            margin-top: 50px;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #aaaaaa;
            text-align: center;
            max-width: 80%;
        }

        .highlight {
            color: #00ff96;
            font-weight: 600;
        }

        #help {
            position: absolute;
            bottom: 30px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="mic-container">
        <div id="mic-icon">🎙️</div>
    </div>

    <div id="status">Click the microphone to wake LUMAX.</div>
    
    <div id="help">Try saying: "Go to Wonder Pedal" or "Open Avatar"</div>

    <script>
        const statusEl = document.getElementById('status');
        const micContainer = document.getElementById('mic-container');

        // Check for Web Speech API Support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusEl.innerHTML = "Web Speech API not supported in this browser.<br>Please use the native Meta Quest Browser.";
            micContainer.classList.add('error');
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = false; // Stop after a single command
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            // Routes Map
            const routes = {
                "wonder pedal": "/",                  // Routes to the WebXR AR Pedal
                "wonder petal": "/",                  // Common misrecognition
                "pedal": "/",                         
                "avatar": "https://192.168.8.106:5176", // WebUI Avatar port
                "home": "https://lumax.1um6a.se"      
            };

            const startListening = () => {
                try {
                    recognition.start();
                    statusEl.innerHTML = "Listening...<br>Where would you like to go?";
                    micContainer.classList.add('listening');
                    micContainer.classList.remove('error');
                } catch (e) {
                    console.error("Speech recognition already running", e);
                }
            };

            micContainer.addEventListener('click', startListening);

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase();
                statusEl.innerHTML = `Heard: "<span class="highlight">${transcript}</span>"`;
                console.log("Transcript:", transcript);

                let routed = false;
                for (const [key, url] of Object.entries(routes)) {
                    if (transcript.includes(key)) {
                        statusEl.innerHTML += `<br><br>Routing to <b>${key}</b>...`;
                        routed = true;
                        setTimeout(() => {
                            window.location.href = url;
                        }, 1000);
                        break;
                    }
                }

                if (!routed) {
                    setTimeout(() => {
                        statusEl.innerHTML = "Command not recognized. Tap to try again.";
                        micContainer.classList.remove('listening');
                    }, 2000);
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                if (event.error === 'not-allowed') {
                    statusEl.innerHTML = "Microphone access denied! Please allow microphone permissions.";
                } else {
                    statusEl.innerHTML = `Error: ${event.error}. Tap to try again.`;
                }
                micContainer.classList.remove('listening');
                micContainer.classList.add('error');
            };

            recognition.onend = () => {
                micContainer.classList.remove('listening');
            };
        }
    </script>
</body>
</html>
