# FoveAI Input FX — virtual filtered microphone pedalboard
# Real mic -> noise HP/hiss -> fove_gate -> fove_comp -> fove_drive ->
#   rumble shelf -> presence peak -> dry + convolver reverb + slap delay -> mixer
# -> virtual source "mic_fx_source"
# Controls modulated live via set-mic-fx (pw-cli Props on node "mic_fx_capture").
# Mono chain. gate/comp/drive are our own LADSPA pedals (~/.ladspa/fovefx.so).
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "FoveAI Filtered Mic"
            media.name       = "FoveAI Filtered Mic"
            filter.graph = {
                nodes = [
                    {
                        type    = builtin
                        name    = hp
                        label   = bq_highpass
                        control = { "Freq" = 20.0 "Q" = 0.7 }
                    }
                    {
                        type    = builtin
                        name    = hiss
                        label   = bq_highshelf
                        control = { "Freq" = 9000.0 "Q" = 0.7 "Gain" = 0.0 }
                    }
                    {
                        type   = ladspa
                        name   = gate
                        plugin = "/home/lumba/.ladspa/fovefx.so"
                        label  = "fove_gate"
                        control = {
                            "Threshold" = 0.0009
                            "Attack"    = 10.0
                            "Release"   = 180.0
                            "Range"     = 0.01
                        }
                    }
                    {
                        type   = ladspa
                        name   = comp
                        plugin = "/home/lumba/.ladspa/fovefx.so"
                        label  = "fove_comp"
                        control = {
                            "Threshold" = 0.0
                            "Ratio"     = 1.0
                            "Attack"    = 20.0
                            "Release"   = 250.0
                            "Makeup"    = 0.0
                        }
                    }
                    {
                        type   = ladspa
                        name   = drive
                        plugin = "/home/lumba/.ladspa/fovefx.so"
                        label  = "fove_drive"
                        control = { "Drive" = 1.0 "Mix" = 0.0 }
                    }
                    {
                        type    = builtin
                        name    = ls
                        label   = bq_lowshelf
                        control = { "Freq" = 120.0 "Q" = 0.8 "Gain" = 0.0 }
                    }
                    {
                        type    = builtin
                        name    = clar
                        label   = bq_peaking
                        control = { "Freq" = 3200.0 "Q" = 0.9 "Gain" = 0.0 }
                    }
                    {
                        type   = builtin
                        name   = conv
                        label  = convolver
                        config = {
                            filename = "/home/lumba/.config/pipewire/impulses/studio-small.wav"
                            channel  = 0
                            gain     = 0.9
                        }
                    }
                    {
                        type    = builtin
                        name    = dly
                        label   = delay
                        config  = { "max-delay" = 0.5 }
                        control = { "Delay (s)" = 0.18 }
                    }
                    {
                        type   = builtin
                        name   = mix
                        label  = mixer
                        control = {
                            "Gain 1" = 1.0
                            "Gain 2" = 0.0
                            "Gain 3" = 0.0
                        }
                    }
                ]
                inputs  = [ "hp:In" ]
                outputs = [ "mix:Out" ]
                links = [
                    { output = "hp:Out"       input = "hiss:In" }
                    { output = "hiss:Out"     input = "gate:Input" }
                    { output = "gate:Output"  input = "comp:Input" }
                    { output = "comp:Output"  input = "drive:Input" }
                    { output = "drive:Output" input = "ls:In" }
                    { output = "ls:Out"       input = "clar:In" }
                    { output = "clar:Out"     input = "mix:In 1" }
                    { output = "clar:Out"     input = "conv:In" }
                    { output = "clar:Out"     input = "dly:In" }
                    { output = "conv:Out"     input = "mix:In 2" }
                    { output = "dly:Out"      input = "mix:In 3" }
                ]
            }
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name   = "mic_fx_capture"
                node.passive = true
                target.object = "alsa_input.usb-Sunplus_IT_Co_AUSDOM_FHD_Camera-02.analog-stereo"
            }
            playback.props = {
                node.name   = "mic_fx_source"
                media.class = Audio/Source
                node.passive = true
            }
        }
    }
]
