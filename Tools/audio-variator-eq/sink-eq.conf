# Native PipeWire Parametric Equalizer + Studio Pitch Shifter + FX
# Stereo graph: 5-band biquad EQ -> Rubber Band R3 pitch ->
#   dry + convolution reverb + detune-chorus -> per-channel mixer.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "System Equalizer & Pitch"
            media.name       = "System Equalizer & Pitch"
            filter.graph = {
                nodes = [
                    # ---------- LEFT channel chain ----------
                    {
                        type  = builtin
                        name  = eq_band_1_l
                        label = bq_lowshelf
                        control = { "Freq" = 100.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2_l
                        label = bq_peaking
                        control = { "Freq" = 250.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3_l
                        label = bq_peaking
                        control = { "Freq" = 1000.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4_l
                        label = bq_peaking
                        control = { "Freq" = 3500.0 "Q" = 1.2 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5_l
                        label = bq_highshelf
                        control = { "Freq" = 8000.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type   = ladspa
                        name   = pitch_l
                        plugin = "/home/lumba/.ladspa/am_pitchshift_1433.so"
                        label  = "amPitchshift"
                        control = { "Pitch shift" = 1.0 "Buffer size" = 4.0 }
                    }
                    {
                        type   = builtin
                        name   = reverb_l
                        label  = convolver
                        config = {
                            filename = "/home/lumba/.config/pipewire/impulses/studio-small.wav"
                            channel  = 0
                            gain     = 0.9
                        }
                    }
                    {
                        type   = ladspa
                        name   = detune_l
                        plugin = "/home/lumba/.ladspa/am_pitchshift_1433.so"
                        label  = "amPitchshift"
                        control = { "Pitch shift" = 1.004 "Buffer size" = 4.0 }
                    }
                    {
                        type   = builtin
                        name   = mix_l
                        label  = mixer
                        control = {
                            "Gain 1" = 1.0
                            "Gain 2" = 0.0
                            "Gain 3" = 0.0
                            "Gain 4" = 0.0
                            "Gain 5" = 0.0
                            "Gain 6" = 0.0
                            "Gain 7" = 0.0
                            "Gain 8" = 0.0
                        }
                    }
                    # ---------- SPACE extras: cathedral rev, echo, chorus voice 2 ----------
                    {
                        type   = builtin
                        name   = reverb2_l
                        label  = convolver
                        config = {
                            filename = "/home/lumba/.config/pipewire/impulses/cathedral.wav"
                            channel  = 0
                            gain     = 0.9
                        }
                    }
                    {
                        type   = builtin
                        name   = del_l
                        label  = delay
                        config = { "max-delay" = 1.0 }
                        control = { "Delay (s)" = 0.25 }
                    }
                    {
                        type   = ladspa
                        name   = detune2_l
                        plugin = "/home/lumba/.ladspa/am_pitchshift_1433.so"
                        label  = "amPitchshift"
                        control = { "Pitch shift" = 0.997 "Buffer size" = 4.0 }
                    }
                    # ---------- Stereo widener / surround sim ----------
                    {
                        type   = builtin
                        name   = inv_r
                        label  = invert
                    }
                    {
                        type   = builtin
                        name   = side
                        label  = mixer
                        control = {
                            "Gain 1" = 0.5
                            "Gain 2" = 0.5
                        }
                    }
                    {
                        type   = builtin
                        name   = inv_side
                        label  = invert
                    }
                    {
                        type   = builtin
                        name   = xdelay_l
                        label  = delay
                        config = { "max-delay" = 0.05 }
                        control = { "Delay (s)" = 0.012 }
                    }
                    {
                        type   = builtin
                        name   = xdelay_r
                        label  = delay
                        config = { "max-delay" = 0.05 }
                        control = { "Delay (s)" = 0.012 }
                    }
                    # ---------- RIGHT channel chain ----------
                    {
                        type  = builtin
                        name  = eq_band_1_r
                        label = bq_lowshelf
                        control = { "Freq" = 100.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2_r
                        label = bq_peaking
                        control = { "Freq" = 250.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3_r
                        label = bq_peaking
                        control = { "Freq" = 1000.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4_r
                        label = bq_peaking
                        control = { "Freq" = 3500.0 "Q" = 1.2 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5_r
                        label = bq_highshelf
                        control = { "Freq" = 8000.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type   = ladspa
                        name   = pitch_r
                        plugin = "/home/lumba/.ladspa/am_pitchshift_1433.so"
                        label  = "amPitchshift"
                        control = { "Pitch shift" = 1.0 "Buffer size" = 4.0 }
                    }
                    {
                        type   = builtin
                        name   = reverb_r
                        label  = convolver
                        config = {
                            filename = "/home/lumba/.config/pipewire/impulses/studio-small.wav"
                            channel  = 1
                            gain     = 0.9
                        }
                    }
                    {
                        type   = ladspa
                        name   = detune_r
                        plugin = "/home/lumba/.ladspa/am_pitchshift_1433.so"
                        label  = "amPitchshift"
                        control = { "Pitch shift" = 0.996 "Buffer size" = 4.0 }
                    }
                    {
                        type   = builtin
                        name   = mix_r
                        label  = mixer
                        control = {
                            "Gain 1" = 1.0
                            "Gain 2" = 0.0
                            "Gain 3" = 0.0
                            "Gain 4" = 0.0
                            "Gain 5" = 0.0
                            "Gain 6" = 0.0
                            "Gain 7" = 0.0
                            "Gain 8" = 0.0
                        }
                    }
                    {
                        type   = builtin
                        name   = reverb2_r
                        label  = convolver
                        config = {
                            filename = "/home/lumba/.config/pipewire/impulses/cathedral.wav"
                            channel  = 1
                            gain     = 0.9
                        }
                    }
                    {
                        type   = builtin
                        name   = del_r
                        label  = delay
                        config = { "max-delay" = 1.0 }
                        control = { "Delay (s)" = 0.25 }
                    }
                    {
                        type   = ladspa
                        name   = detune2_r
                        plugin = "/home/lumba/.ladspa/am_pitchshift_1433.so"
                        label  = "amPitchshift"
                        control = { "Pitch shift" = 1.003 "Buffer size" = 4.0 }
                    }
                    # ---------- Output bus compressor (FoveAI fove_comp) ----------
                    {
                        type   = ladspa
                        name   = comp_l
                        plugin = "/home/lumba/.ladspa/fovefx.so"
                        label  = "fove_comp"
                        control = { "Threshold" = 0.0 "Ratio" = 1.0 "Attack" = 20.0 "Release" = 250.0 "Makeup" = 0.0 }
                    }
                    {
                        type   = ladspa
                        name   = comp_r
                        plugin = "/home/lumba/.ladspa/fovefx.so"
                        label  = "fove_comp"
                        control = { "Threshold" = 0.0 "Ratio" = 1.0 "Attack" = 20.0 "Release" = 250.0 "Makeup" = 0.0 }
                    }
                ]
                inputs  = [ "eq_band_1_l:In" "eq_band_1_r:In" ]
                outputs = [ "comp_l:Output" "comp_r:Output" ]
                links = [
                    # LEFT: eq chain -> pitch -> dry/reverb/detune -> mixer
                    { output = "eq_band_1_l:Out" input = "eq_band_2_l:In" }
                    { output = "eq_band_2_l:Out" input = "eq_band_3_l:In" }
                    { output = "eq_band_3_l:Out" input = "eq_band_4_l:In" }
                    { output = "eq_band_4_l:Out" input = "eq_band_5_l:In" }
                    { output = "eq_band_5_l:Out" input = "pitch_l:Input" }
                    { output = "pitch_l:Output"  input = "mix_l:In 1" }
                    { output = "pitch_l:Output"  input = "reverb_l:In" }
                    { output = "pitch_l:Output"  input = "detune_l:Input" }
                    { output = "reverb_l:Out"    input = "mix_l:In 2" }
                    { output = "detune_l:Output" input = "mix_l:In 3" }
                    # RIGHT: eq chain -> pitch -> dry/reverb/detune -> mixer
                    { output = "eq_band_1_r:Out" input = "eq_band_2_r:In" }
                    { output = "eq_band_2_r:Out" input = "eq_band_3_r:In" }
                    { output = "eq_band_3_r:Out" input = "eq_band_4_r:In" }
                    { output = "eq_band_4_r:Out" input = "eq_band_5_r:In" }
                    { output = "eq_band_5_r:Out" input = "pitch_r:Input" }
                    { output = "pitch_r:Output"  input = "mix_r:In 1" }
                    { output = "pitch_r:Output"  input = "reverb_r:In" }
                    { output = "pitch_r:Output"  input = "detune_r:Input" }
                    { output = "reverb_r:Out"    input = "mix_r:In 2" }
                    { output = "detune_r:Output" input = "mix_r:In 3" }
                    # Stereo widener: side = (L - R)/2 boosted into each channel
                    { output = "pitch_r:Output"  input = "inv_r:In" }
                    { output = "pitch_l:Output"  input = "side:In 1" }
                    { output = "inv_r:Out"       input = "side:In 2" }
                    { output = "side:Out"        input = "mix_l:In 4" }
                    { output = "side:Out"        input = "inv_side:In" }
                    { output = "inv_side:Out"    input = "mix_r:In 4" }
                    # Surround sim: delayed crossfeed (Haas effect)
                    { output = "pitch_l:Output"  input = "xdelay_l:In" }
                    { output = "pitch_r:Output"  input = "xdelay_r:In" }
                    { output = "xdelay_l:Out"    input = "mix_r:In 5" }
                    { output = "xdelay_r:Out"    input = "mix_l:In 5" }
                    # SPACE extras feeds
                    { output = "pitch_l:Output"  input = "reverb2_l:In" }
                    { output = "pitch_r:Output"  input = "reverb2_r:In" }
                    { output = "pitch_l:Output"  input = "del_l:In" }
                    { output = "pitch_r:Output"  input = "del_r:In" }
                    { output = "pitch_l:Output"  input = "detune2_l:Input" }
                    { output = "pitch_r:Output"  input = "detune2_r:Input" }
                    { output = "reverb2_l:Out"   input = "mix_l:In 6" }
                    { output = "reverb2_r:Out"   input = "mix_r:In 6" }
                    { output = "del_l:Out"       input = "mix_l:In 7" }
                    { output = "del_r:Out"       input = "mix_r:In 7" }
                    { output = "detune2_l:Output" input = "mix_l:In 8" }
                    { output = "detune2_r:Output" input = "mix_r:In 8" }
                    # Bus compressor on the summed output
                    { output = "mix_l:Out"       input = "comp_l:Input" }
                    { output = "mix_r:Out"       input = "comp_r:Input" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.eq"
                media.class = Audio/Sink
                node.description = "System Equalizer"
            }
            playback.props = {
                node.name   = "effect_output.eq"
                node.passive = true
                target.object = "alsa_output.pci-0000_01_00.1.hdmi-stereo"
            }
        }
    }
]
