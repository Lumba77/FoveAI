name: Publish Jenna Copilot

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for gh release create

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node setup ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install deps ────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Bundle ──────────────────────────────────────────────────────────
      - name: Bundle extension
        run: npm run bundle

      # ── 5. Package .vsix ───────────────────────────────────────────────────
      - name: Package .vsix
        run: npx @vscode/vsce package --no-dependencies

      # ── 6. Resolve filename ────────────────────────────────────────────────
      - name: Resolve .vsix filename
        id: vsix
        run: echo "file=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

      # ── 7. GitHub Release ──────────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes-file CHANGELOG.md \
            "${{ steps.vsix.outputs.file }}"

      # ── 8. Publish to Open VSX ─────────────────────────────────────────────
      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "${{ steps.vsix.outputs.file }}" -p "$OVSX_PAT"
