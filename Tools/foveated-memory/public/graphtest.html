<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XRLF Sequential Benchmark Results</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: #05060a;
            color: #c7e7ff;
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 30px;
        }
        h1 {
            font-weight: 500;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #7fd0ff;
            text-align: center;
            margin-bottom: 30px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .charts-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 20px;
        }
        .chart-box {
            background: #090c14;
            border: 1px solid #273447;
            border-radius: 12px;
            padding: 20px;
        }
        .chart-title {
            text-align: center;
            color: #9fd8ff;
            font-weight: bold;
            margin-bottom: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: #090c14;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #273447;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #273447;
        }
        th {
            background: #101623;
            color: #7fd0ff;
            font-weight: bold;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .delta-positive { color: #4ade80; font-weight: bold; }
        .delta-negative { color: #f87171; font-weight: bold; }
        .action-bar {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            background: #102132;
            color: #7fd0ff;
            border: 1px solid #7fd0ff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #1a3652;
        }
    </style>
    <script src="http://127.0.0.1:8415/foveai_theme_sync.js"></script>
</head>
<body>

<div class="container">
    <h1>XRLF Sequential Benchmark Results</h1>

    <div class="action-bar">
        <button onclick="loadData()">🔄 Reload Results Data</button>
    </div>

    <div class="charts-wrapper">
        <div class="chart-box">
            <div class="chart-title">Overall Accuracy (%)</div>
            <canvas id="accuracyChart"></canvas>
        </div>
        <div class="chart-box">
            <div class="chart-title">Avg Latency per Turn (ms)</div>
            <canvas id="latencyChart"></canvas>
        </div>
    </div>

    <table id="resultsTable">
        <thead>
            <tr>
                <th>Model</th>
                <th>Run Time</th>
                <th>Overall Accuracy</th>
                <th>Overall Latency</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="4" style="text-align:center;">Loading results...</td></tr>
        </tbody>
    </table>
</div>

<script>
    let accChartInstance = null;
    let latChartInstance = null;

    async function loadData() {
        try {
            // Force cache busting to get latest JSON
            const res = await fetch('benchmark_results.json?v=' + Date.now());
            if (!res.ok) {
                throw new Error("benchmark_results.json not found. Run the python script first.");
            }
            const data = await res.json();
            renderCharts(data);
            renderTable(data);
        } catch (e) {
            console.error(e);
            document.querySelector('#resultsTable tbody').innerHTML = 
                `<tr><td colspan="4" style="text-align:center; color:#f87171;">Error loading data: ${e.message}</td></tr>`;
        }
    }

    function renderCharts(data) {
        const labels = data.map(d => d.model);
        const accuracyData = data.map(d => d.overall_accuracy);
        const latencyData = data.map(d => d.overall_latency_ms);

        // Colors
        const bgColors = data.map(d => d.model.toLowerCase().includes('xrlf') ? 'rgba(127, 208, 255, 0.6)' : 'rgba(255, 0, 170, 0.6)');
        const borderColors = data.map(d => d.model.toLowerCase().includes('xrlf') ? '#7fd0ff' : '#ff00aa');

        const accCtx = document.getElementById('accuracyChart').getContext('2d');
        if (accChartInstance) accChartInstance.destroy();
        accChartInstance = new Chart(accCtx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Accuracy (%)',
                    data: accuracyData,
                    backgroundColor: bgColors,
                    borderColor: borderColors,
                    borderWidth: 1
                }]
            },
            options: {
                scales: { y: { beginAtZero: true, max: 100, grid: { color: '#273447' } }, x: { grid: { display: false } } },
                plugins: { legend: { display: false } },
                color: '#c7e7ff'
            }
        });

        const latCtx = document.getElementById('latencyChart').getContext('2d');
        if (latChartInstance) latChartInstance.destroy();
        latChartInstance = new Chart(latCtx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Latency (ms)',
                    data: latencyData,
                    backgroundColor: bgColors,
                    borderColor: borderColors,
                    borderWidth: 1
                }]
            },
            options: {
                scales: { y: { beginAtZero: true, grid: { color: '#273447' } }, x: { grid: { display: false } } },
                plugins: { legend: { display: false } },
                color: '#c7e7ff'
            }
        });
    }

    function renderTable(data) {
        const tbody = document.querySelector('#resultsTable tbody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No results available.</td></tr>';
            return;
        }

        data.forEach(d => {
            const tr = document.createElement('tr');
            
            // Format time cleanly
            let tstamp = d.timestamp;
            try {
                tstamp = new Date(d.timestamp).toLocaleString();
            } catch(e) {}

            tr.innerHTML = `
                <td style="font-weight:bold; color: ${d.model.toLowerCase().includes('xrlf') ? '#7fd0ff' : '#ff00aa'};">${d.model}</td>
                <td style="color:#94a3b8; font-size: 12px;">${tstamp}</td>
                <td>${d.overall_accuracy.toFixed(1)}%</td>
                <td>${d.overall_latency_ms} ms</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Initial load
    loadData();
</script>
</body>
</html>
