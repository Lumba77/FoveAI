<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LUMAX Copilot</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00f3ff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="loader">Loading LUMAX Vessel...</div>
  <!-- Embeds the live Vessel directly into the Chrome Sidebar -->
  <iframe src="http://localhost:5176/" allow="microphone; camera; xr-spatial-tracking; display-capture; autoplay"></iframe>
</body>
</html>
