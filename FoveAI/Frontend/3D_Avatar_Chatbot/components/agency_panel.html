<div style="display: flex; flex-direction: column; height: 100%; font-family: monospace;">
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">
        Monitor background agency processes, autonomous tool execution, and motor cortex state.
        <span style="color: var(--status-ok);" id="agency-conn-status">● Connected</span>
    </p>

    <!-- Status Cards -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem;">
        <div style="background: rgba(0,243,255,0.05); border: 1px solid rgba(0,243,255,0.2); border-radius: 4px; padding: 8px;">
            <div style="font-size: 0.6rem; color: #00f3ff; letter-spacing: 0.1em;">MOTOR CORTEX</div>
            <div style="font-size: 0.9rem; color: #fff; margin-top: 4px;" id="agency-motor-state">disconnected</div>
        </div>
        <div style="background: rgba(57,255,20,0.05); border: 1px solid rgba(57,255,20,0.2); border-radius: 4px; padding: 8px;">
            <div style="font-size: 0.6rem; color: #39ff14; letter-spacing: 0.1em;">BEHAVIOR STATE</div>
            <div style="font-size: 0.9rem; color: #fff; margin-top: 4px;" id="agency-behavior-state">calm_idle</div>
        </div>
        <div style="background: rgba(255,0,127,0.05); border: 1px solid rgba(255,0,127,0.2); border-radius: 4px; padding: 8px;">
            <div style="font-size: 0.6rem; color: #ff007f; letter-spacing: 0.1em;">EMOTION</div>
            <div style="font-size: 0.9rem; color: #fff; margin-top: 4px;" id="agency-emotion-state">neutral</div>
        </div>
        <div style="background: rgba(255,170,0,0.05); border: 1px solid rgba(255,170,0,0.2); border-radius: 4px; padding: 8px;">
            <div style="font-size: 0.6rem; color: #ffaa00; letter-spacing: 0.1em;">MOVING</div>
            <div style="font-size: 0.9rem; color: #fff; margin-top: 4px;" id="agency-moving-state">No</div>
        </div>
    </div>

    <!-- Motor Control Buttons -->
    <div style="display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap;">
        <button class="primary-btn" style="flex: 1; min-width: 80px;" id="agency-cmd-wave">👋 Wave</button>
        <button class="primary-btn" style="flex: 1; min-width: 80px;" id="agency-cmd-happy">😊 Happy</button>
        <button class="primary-btn" style="flex: 1; min-width: 80px;" id="agency-cmd-sad">😢 Sad</button>
        <button class="primary-btn" style="flex: 1; min-width: 80px;" id="agency-cmd-walk">🚶 Walk</button>
        <button class="primary-btn" style="flex: 1; min-width: 80px;" id="agency-cmd-home">🏠 Home</button>
    </div>

    <!-- Terminal Output Area -->
    <div id="agency-terminal-output" style="
        flex: 1;
        background: #02050a;
        border: 1px solid rgba(0, 243, 255, 0.2);
        border-radius: 4px;
        padding: 1rem;
        overflow-y: auto;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 0.85rem;
        color: #00f3ff;
        margin-bottom: 1rem;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    ">
        <div><span style="color: #4caf50;">[SYSTEM]</span> Nexus Agency Daemon initialized.</div>
        <div><span style="color: #4caf50;">[SYSTEM]</span> LumaxIntegrationLayer connected.</div>
    </div>

    <!-- Terminal Input Area -->
    <div style="display: flex; gap: 8px;">
        <span style="color: #00f3ff; font-weight: bold; align-self: center;">></span>
        <input type="text" id="agency-terminal-input" class="text-input" placeholder="Execute command (/ping, /emotion:happy, /walk, /home)" style="flex: 1; font-family: monospace;">
        <button id="agency-execute-btn" class="primary-btn" style="width: 100px;">EXECUTE</button>
    </div>
</div>

<script>
    (function() {
        const output = document.getElementById('agency-terminal-output');
        const input = document.getElementById('agency-terminal-input');
        const btn = document.getElementById('agency-execute-btn');

        function appendLog(text, type = 'INFO') {
            const line = document.createElement('div');
            line.style.marginBottom = '4px';
            let prefixColor = '#00f3ff';
            if (type === 'WARN') prefixColor = '#ff9800';
            if (type === 'ERROR') prefixColor = '#f44336';
            if (type === 'USER') prefixColor = '#e91e63';
            if (type === 'MOTOR') prefixColor = '#39ff14';
            if (type === 'EMOTION') prefixColor = '#ff007f';
            line.innerHTML = `<span style="color: ${prefixColor};">[${type}]</span> ${text}`;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        // Update status from integration layer
        function updateStatus() {
            const integration = window.LUMAX_INTEGRATION;
            if (!integration) return;

            const motorState = document.getElementById('agency-motor-state');
            const behaviorState = document.getElementById('agency-behavior-state');
            const emotionState = document.getElementById('agency-emotion-state');
            const movingState = document.getElementById('agency-moving-state');

            if (motorState) motorState.textContent = integration.motorConnected ? 'connected' : 'disconnected';
            if (behaviorState) behaviorState.textContent = integration.getState();
            if (emotionState) emotionState.textContent = integration.currentEmotion || 'neutral';
            if (movingState) movingState.textContent = integration.isMoving() ? 'Yes' : 'No';
        }

        // Listen for state changes
        window.addEventListener('lumax_state_changed', (e) => {
            appendLog(`State: ${e.detail?.from} → ${e.detail?.to}`, 'INFO');
            updateStatus();
        });

        window.addEventListener('lumax_emotion_changed', (e) => {
            appendLog(`Emotion: ${e.detail?.emotion} (${e.detail?.intensity})`, 'EMOTION');
            updateStatus();
        });

        window.addEventListener('lumax_body_feedback', (e) => {
            appendLog(`Feedback: ${e.detail?.type}`, 'MOTOR');
            updateStatus();
        });

        // Motor control buttons
        document.getElementById('agency-cmd-wave')?.addEventListener('click', () => {
            const integration = window.LUMAX_INTEGRATION;
            if (integration) {
                integration.queueMicroGesture('wave');
                appendLog('Queued gesture: wave', 'MOTOR');
            }
        });

        document.getElementById('agency-cmd-happy')?.addEventListener('click', () => {
            const integration = window.LUMAX_INTEGRATION;
            if (integration) {
                integration.setEmotion('happy', 1.0);
                appendLog('Set emotion: happy', 'EMOTION');
            }
        });

        document.getElementById('agency-cmd-sad')?.addEventListener('click', () => {
            const integration = window.LUMAX_INTEGRATION;
            if (integration) {
                integration.setEmotion('sad', 0.8);
                appendLog('Set emotion: sad', 'EMOTION');
            }
        });

        document.getElementById('agency-cmd-walk')?.addEventListener('click', () => {
            const integration = window.LUMAX_INTEGRATION;
            if (integration) {
                integration.commandWalkForward(1.0);
                appendLog('Command: walk forward 1m', 'MOTOR');
            }
        });

        document.getElementById('agency-cmd-home')?.addEventListener('click', () => {
            const integration = window.LUMAX_INTEGRATION;
            if (integration) {
                integration.commandReturnHome();
                appendLog('Command: return home', 'MOTOR');
            }
        });

        // Terminal command execution
        btn.addEventListener('click', () => {
            const cmd = input.value.trim();
            if (!cmd) return;
            appendLog(cmd, 'USER');
            input.value = '';

            const integration = window.LUMAX_INTEGRATION;

            if (cmd === '/ping') {
                appendLog('PONG. All systems nominal.', 'INFO');
                if (integration) {
                    appendLog(`Motor: ${integration.motorConnected ? 'connected' : 'disconnected'}`, 'INFO');
                    appendLog(`State: ${integration.getState()}`, 'INFO');
                    appendLog(`Emotion: ${integration.currentEmotion}`, 'INFO');
                }
            } else if (cmd.startsWith('/emotion:')) {
                const emotion = cmd.split(':')[1];
                if (integration) {
                    integration.setEmotion(emotion, 1.0);
                    appendLog(`Emotion set: ${emotion}`, 'EMOTION');
                }
            } else if (cmd === '/walk') {
                if (integration) {
                    integration.commandWalkForward(1.0);
                    appendLog('Walking forward 1m', 'MOTOR');
                }
            } else if (cmd === '/home') {
                if (integration) {
                    integration.commandReturnHome();
                    appendLog('Returning home', 'MOTOR');
                }
            } else if (cmd.startsWith('/gesture:')) {
                const gesture = cmd.split(':')[1];
                if (integration) {
                    integration.queueMicroGesture(gesture);
                    appendLog(`Gesture queued: ${gesture}`, 'MOTOR');
                }
            } else if (cmd === '/status') {
                if (integration) {
                    appendLog(`State: ${integration.getState()}`, 'INFO');
                    appendLog(`Emotion: ${integration.currentEmotion} (${integration.emotionIntensity})`, 'INFO');
                    appendLog(`Moving: ${integration.isMoving()}`, 'INFO');
                    appendLog(`Motor: ${integration.motorConnected ? 'connected' : 'disconnected'}`, 'INFO');
                    appendLog(`Drives: ${JSON.stringify(integration.getDrives())}`, 'INFO');
                } else {
                    appendLog('Integration layer not available', 'WARN');
                }
            } else if (cmd === '/hud') {
                const hud = window.LUMAX_HUD_3D;
                if (hud) {
                    hud.toggle();
                    appendLog(`3D HUD: ${hud.isVisible() ? 'shown' : 'hidden'}`, 'INFO');
                }
            } else {
                appendLog(`Unknown command: ${cmd}`, 'ERROR');
                appendLog('Available: /ping, /emotion:NAME, /walk, /home, /gesture:NAME, /status, /hud', 'INFO');
            }
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btn.click();
        });

        // Initial status update
        setTimeout(updateStatus, 500);
        setInterval(updateStatus, 2000);
    })();
</script>
