<div style="display: flex; flex-direction: row; height: 100%; width: 100%;">
    <!-- Left column for Info (Vertical Text) -->
    <div style="flex-shrink: 0; display: flex; flex-direction: row; align-items: flex-end; justify-content: flex-start; padding: 20px 10px; background: rgba(0,0,0,0.2); border-right: 1px solid var(--glass-border);">
        <h2 style="margin: 0; font-family: var(--font-display); font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; color: #fff; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap;">SYSTEM CONFIGURATION</h2>
        <p style="margin: 0 0 0 15px; font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; writing-mode: vertical-rl; transform: rotate(180deg);">
            Global Fleet Control
        </p>
    </div>

    <!-- Right column for Settings Form -->
    <div style="flex: 1; background: #000; overflow-y: auto; padding: 20px;">
        <h3 style="color:#00f3ff; margin-top:0; font-family: var(--font-display); letter-spacing: 2px;">ENVIRONMENT & FEATURES</h3>
        
        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;">
            <label style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 15px; cursor:pointer;">
                <span style="color:#e0e0e0; font-family: var(--font-body);">3D Avatar Render Engine</span>
                <input type="checkbox" id="web-env-hud-enabled" style="width: 20px; height: 20px; accent-color: #00f3ff;">
            </label>
            
            <label style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 15px; cursor:pointer;">
                <span style="color:#e0e0e0; font-family: var(--font-body);">Audio-Only Proxy Mode</span>
                <input type="checkbox" id="web-env-audio-only" style="width: 20px; height: 20px; accent-color: #2ecc71;">
            </label>

            <label style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 15px; cursor:pointer;">
                <span style="color:#e0e0e0; font-family: var(--font-body);">Token Conservation (Max 3000)</span>
                <input type="checkbox" id="web-env-token-conserv" style="width: 20px; height: 20px; accent-color: #ffaa00;">
            </label>

            <label style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 15px; cursor:pointer;" title="Runs a lazy CPU model in the background to summarize code">
                <span style="color:#e0e0e0; font-family: var(--font-body);">Lazy Smart Librarian (CPU)</span>
                <input type="checkbox" id="web-env-librarian" style="width: 20px; height: 20px; accent-color: #e74c3c;">
            </label>

            <label style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 15px; cursor:pointer;">
                <span style="color:#e0e0e0; font-family: var(--font-body);">Autonomous Movement Engine</span>
                <input type="checkbox" id="web-env-autonomous" checked style="width: 20px; height: 20px; accent-color: #39ff14;">
            </label>

            <label style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 15px; cursor:pointer;">
                <span style="color:#e0e0e0; font-family: var(--font-body);">3D In-Game HUD</span>
                <input type="checkbox" id="web-env-3d-hud" checked style="width: 20px; height: 20px; accent-color: #ff007f;">
            </label>
            
            <div style="display:flex; align-items:center; justify-content:space-between; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                <button id="web-btn-env-save" style="background: rgba(0,243,255,0.1); color: #00f3ff; border: 1px solid #00f3ff; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor:pointer;">
                    💾 SAVE TO .ENV & REBOOT FLEET
                </button>
                <span id="web-msg-env" style="font-size: 12px;"></span>
            </div>
        </div>

        <h3 style="color:#2ecc71; margin-top:20px; font-family: var(--font-display); letter-spacing: 2px;">SERVICE CONTROL</h3>
        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
            <div id="web-svc-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
                <!-- Filled dynamically -->
            </div>
            
            <button id="web-btn-svc-refresh" style="background: transparent; color: #888; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor:pointer;">
                ⟳ REFRESH STATUS
            </button>
        </div>

        <h3 style="color:#ff007f; margin-top:20px; font-family: var(--font-display); letter-spacing: 2px;">MOTOR CORTEX CONTROL</h3>
        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="motor-cmd-btn" data-cmd='{"type":"emotion","value":"happy"}' style="background: rgba(57,255,20,0.1); color: #39ff14; border: 1px solid #39ff14; padding: 8px 12px; border-radius: 4px; cursor:pointer;">😊 Happy</button>
                <button class="motor-cmd-btn" data-cmd='{"type":"emotion","value":"sad"}' style="background: rgba(255,0,127,0.1); color: #ff007f; border: 1px solid #ff007f; padding: 8px 12px; border-radius: 4px; cursor:pointer;">😢 Sad</button>
                <button class="motor-cmd-btn" data-cmd='{"type":"emotion","value":"dance"}' style="background: rgba(255,170,0,0.1); color: #ffaa00; border: 1px solid #ffaa00; padding: 8px 12px; border-radius: 4px; cursor:pointer;">💃 Dance</button>
                <button class="motor-cmd-btn" data-cmd='{"type":"emotion","value":"thinking"}' style="background: rgba(0,243,255,0.1); color: #00f3ff; border: 1px solid #00f3ff; padding: 8px 12px; border-radius: 4px; cursor:pointer;">🤔 Think</button>
                <button class="motor-cmd-btn" data-cmd='{"type":"gesture","value":"wave"}' style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid #fff; padding: 8px 12px; border-radius: 4px; cursor:pointer;">👋 Wave</button>
                <button class="motor-cmd-btn" data-cmd='{"type":"walk","value":"forward"}' style="background: rgba(0,243,255,0.1); color: #00f3ff; border: 1px solid #00f3ff; padding: 8px 12px; border-radius: 4px; cursor:pointer;">🚶 Walk</button>
                <button class="motor-cmd-btn" data-cmd='{"type":"walk","value":"home"}' style="background: rgba(255,170,0,0.1); color: #ffaa00; border: 1px solid #ffaa00; padding: 8px 12px; border-radius: 4px; cursor:pointer;">🏠 Home</button>
            </div>
            <div style="margin-top: 8px; font-size: 0.7rem; color: #888;">
                Motor Cortex: <span id="motor-cortex-status" style="color: #ff4444;">■ disconnected</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ── Initialize checkboxes from localStorage (populated from .env by main.js) ──
    function initCheckboxes() {
        const checkboxMap = {
            'web-env-hud-enabled': 'lumax_hud_enabled',
            'web-env-audio-only': 'lumax_audio_only',
            'web-env-token-conserv': null,
            'web-env-librarian': 'lumax_librarian_enabled',
            'web-env-autonomous': 'lumax_autonomous_movement',
            'web-env-3d-hud': 'lumax_3d_hud_enabled',
        };
        for (const [id, storageKey] of Object.entries(checkboxMap)) {
            const el = document.getElementById(id);
            if (!el) continue;
            if (storageKey) {
                const val = localStorage.getItem(storageKey);
                if (val !== null) {
                    el.checked = val === 'true';
                    console.log('[Settings] Initialized #' + id + ' from localStorage[' + storageKey + ']=' + val);
                }
            } else if (id === 'web-env-token-conserv') {
                const maxTokens = localStorage.getItem('lumax_cloud_max_tokens') || '8192';
                el.checked = parseInt(maxTokens) <= 3000;
            }
        }
    }
    initCheckboxes();

(function() {
    // ── Health Checking ──
    async function refreshServices() {
        const services = [
            { name: 'Soul Core', port: 8000 },
            { name: 'Ears (STT)', port: 8001 },
            { name: 'Memory', port: 8002 },
            { name: 'Creative', port: 8003 },
            { name: 'Cognee KG', port: 8009 },
            { name: 'TokenSlayer', port: 8103 },
            { name: 'Motor Cortex', port: 8110 },
            { name: 'WebUI', port: 8080 }
        ];
        
        const grid = document.getElementById('web-svc-grid');
        if (!grid) return;
        grid.innerHTML = '';
        
        for (const svc of services) {
            let alive = false;
            try {
                const r = await fetch(`/api/health-proxy/${svc.port}`, { signal: AbortSignal.timeout(1000) });
                const data = await r.json();
                alive = data.ok;
            } catch { alive = false; }
            
            const color = alive ? '#2ecc71' : '#ff4444';
            const icon = alive ? '●' : '■';
            
            grid.innerHTML += `
                <div style="display:flex; align-items:center; padding: 10px; background: rgba(0,0,0,0.4); border-radius: 4px; border-left: 3px solid ${color};">
                    <span style="color:${color}; margin-right: 8px;">${icon}</span>
                    <span style="color:#e0e0e0; font-size: 14px; flex:1;">${svc.name}</span>
                    <span style="color:#666; font-size: 11px; font-family: monospace;">:${svc.port}</span>
                </div>
            `;
        }

        // Update motor cortex status
        const motorStatus = document.getElementById('motor-cortex-status');
        if (motorStatus) {
            const integration = window.LUMAX_INTEGRATION;
            if (integration) {
                motorStatus.textContent = integration.motorConnected ? '● connected' : '■ disconnected';
                motorStatus.style.color = integration.motorConnected ? '#2ecc71' : '#ff4444';
            }
        }
    }

    // ── Motor Cortex Commands ──
    document.querySelectorAll('.motor-cmd-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const cmd = JSON.parse(btn.dataset.cmd);
            const integration = window.LUMAX_INTEGRATION;
            if (!integration) {
                if (window.showMessage) window.showMessage('Integration layer not available', 'error');
                return;
            }

            switch (cmd.type) {
                case 'emotion':
                    integration.setEmotion(cmd.value, 1.0);
                    if (window.showMessage) window.showMessage(`Emotion: ${cmd.value}`, 'success');
                    break;
                case 'gesture':
                    integration.queueMicroGesture(cmd.value);
                    if (window.showMessage) window.showMessage(`Gesture: ${cmd.value}`, 'success');
                    break;
                case 'walk':
                    if (cmd.value === 'forward') {
                        integration.commandWalkForward(1.0);
                        if (window.showMessage) window.showMessage('Walking forward', 'success');
                    } else if (cmd.value === 'home') {
                        integration.commandReturnHome();
                        if (window.showMessage) window.showMessage('Returning home', 'success');
                    }
                    break;
            }
        });
    });

    // ── Env Saving ──
    const saveBtn = document.getElementById('web-btn-env-save');
    if (saveBtn) {
        saveBtn.addEventListener('click', async () => {
            const msg = document.getElementById('web-msg-env');
            msg.textContent = 'Saving & Rebooting...';
            msg.style.color = '#888';
            
            const hudEnabled = document.getElementById('web-env-hud-enabled').checked;
            const audioOnly = document.getElementById('web-env-audio-only').checked;
            const tokenConserv = document.getElementById('web-env-token-conserv').checked;
            const librarianEnabled = document.getElementById('web-env-librarian').checked;
            const autonomousEnabled = document.getElementById('web-env-autonomous').checked;
            const hud3dEnabled = document.getElementById('web-env-3d-hud').checked;

            const updates = {
                "LUMAX_HUD_ENABLED": hudEnabled ? "true" : "false",
                "LUMAX_AUDIO_ONLY_PROXY": audioOnly ? "true" : "false",
                "LUMAX_CLOUD_MAX_TOKENS": tokenConserv ? "3000" : "8192",
                "LUMAX_SOFT_PROMPT_TOKENS_HIGH": tokenConserv ? "3000" : "8192",
                "LUMAX_LIBRARIAN_ENABLED": librarianEnabled ? "true" : "false",
                "LUMAX_AUTONOMOUS_MOVEMENT": autonomousEnabled ? "true" : "false",
                "LUMAX_3D_HUD_ENABLED": hud3dEnabled ? "true" : "false"
            };

            try {
                const r = await fetch('/api/soul/env', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ updates })
                });
                if (r.ok) {
                    msg.style.color = '#2ecc71';
                    msg.textContent = '✓ Saved! Reloading page to apply...';
                    // Reload page after brief delay so user sees success message
                    setTimeout(() => location.reload(), 1500);
                } else {
                    throw new Error('HTTP ' + r.status);
                }
            } catch (e) {
                msg.style.color = '#ff4444';
                msg.textContent = '✗ Failed to reach Soul Core';
            }
        });
    }

    const refreshBtn = document.getElementById('web-btn-svc-refresh');
    if (refreshBtn) refreshBtn.addEventListener('click', refreshServices);

    // Initial load
    refreshServices();
    setInterval(refreshServices, 15000);
})();
</script>
