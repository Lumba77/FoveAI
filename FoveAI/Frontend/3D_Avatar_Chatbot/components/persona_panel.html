<div style="display: flex; flex-direction: column; height: 100%; font-family: monospace;">
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">
        Persona management — 6 knowledge domains, MBTI profiles, content ratings.
        <span style="color: var(--status-ok);" id="persona-conn-status">● Checking...</span>
    </p>

    <!-- Persona Grid -->
    <div id="persona-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem;">
        <!-- Filled dynamically -->
    </div>

    <!-- Knowledge Domains -->
    <div style="background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 8px; margin-bottom: 1rem;">
        <div style="font-size: 0.6rem; color: #888; letter-spacing: 0.1em; margin-bottom: 6px;">KNOWLEDGE DOMAINS</div>
        <div id="persona-domains" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.7rem;">
            <div style="color: #00f3ff;">domain_general</div>
            <div style="color: #39ff14;">domain_development</div>
            <div style="color: #ff007f;">domain_operations</div>
            <div style="color: #ffd700;">domain_creativity</div>
            <div style="color: #9b59b6;">domain_lore</div>
            <div style="color: #e74c3c;">domain_emotional</div>
        </div>
    </div>

    <!-- MBTI / Diagnosis Section -->
    <div style="background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 8px; margin-bottom: 0.5rem;">
        <div style="font-size: 0.6rem; color: #888; letter-spacing: 0.1em; margin-bottom: 6px;">MBTI & DIAGNOSIS</div>
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            <select id="persona-mbti-select" style="flex: 1; background: #02050a; color: #00f3ff; border: 1px solid rgba(0,243,255,0.2); border-radius: 4px; padding: 6px; font-family: monospace;">
                <option value="">Select MBTI...</option>
                <option value="INTJ">INTJ - Architect</option>
                <option value="INTP">INTP - Logician</option>
                <option value="ENTJ">ENTJ - Commander</option>
                <option value="ENTP">ENTP - Debater</option>
                <option value="INFJ">INFJ - Advocate</option>
                <option value="INFP">INFP - Mediator</option>
                <option value="ENFJ">ENFJ - Protagonist</option>
                <option value="ENFP">ENFP - Campaigner</option>
                <option value="ISTJ">ISTJ - Logistician</option>
                <option value="ISFJ">ISFJ - Defender</option>
                <option value="ESTJ">ESTJ - Executive</option>
                <option value="ESFJ">ESFJ - Consul</option>
                <option value="ISTP">ISTP - Virtuoso</option>
                <option value="ISFP">ISFP - Adventurer</option>
                <option value="ESTP">ESTP - Entrepreneur</option>
                <option value="ESFP">ESFP - Entertainer</option>
            </select>
        </div>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="persona-diagnosis-input" class="text-input" placeholder="Diagnosis mapping (e.g. ADHD, ASD, anxiety)" style="flex: 1; font-family: monospace;">
            <button class="primary-btn" id="persona-apply-btn" style="width: 100px; background: rgba(57,255,20,0.1); border-color: #39ff14; color: #39ff14;">APPLY</button>
        </div>
    </div>

    <!-- Status -->
    <div id="persona-status" style="font-size: 0.75rem; color: var(--primary); text-align: center; margin-top: 8px;"></div>
</div>

<script>
(function() {
    const BASE = '';
    const grid = document.getElementById('persona-grid');
    const status = document.getElementById('persona-status');
    const connStatus = document.getElementById('persona-conn-status');

    // 5 superintelligent personas from PersonaVRRegistry
    const PERSONAS = [
        { id: 'persona:scarlett-secretary', name: 'Scarlett', type: 'Secretary', rating: 'sfw', orchestrated: true, distance: 1.5 },
        { id: 'persona:milo-friend', name: 'Milo', type: 'Friend', rating: 'sfw', orchestrated: false, distance: 1.0 },
        { id: 'persona:nova-collaborator', name: 'Nova', type: 'Collaborator', rating: 'sfw', orchestrated: true, distance: 1.3 },
        { id: 'persona:luna-girlfriend', name: 'Luna', type: 'Girlfriend', rating: 'mature', orchestrated: false, distance: 0.7 },
        { id: 'persona:velvet-companion', name: 'Velvet', type: 'Companion', rating: 'adult', orchestrated: false, distance: 0.6 }
    ];

    function renderPersonas() {
        grid.innerHTML = '';
        PERSONAS.forEach(p => {
            const ratingColor = p.rating === 'sfw' ? '#2ecc71' : p.rating === 'mature' ? '#ffaa00' : '#ff007f';
            const card = document.createElement('div');
            card.style.cssText = 'background: rgba(0,0,0,0.4); border-radius: 4px; padding: 10px; border-left: 3px solid ' + ratingColor + '; cursor: pointer;';
            card.innerHTML = `
                <div style="font-size: 0.8rem; color: #fff; font-weight: bold;">${p.name}</div>
                <div style="font-size: 0.65rem; color: #888;">${p.type}</div>
                <div style="font-size: 0.6rem; color: ${ratingColor}; margin-top: 4px;">${p.rating.toUpperCase()} · ${p.orchestrated ? 'Orchestrated' : 'Guided'} · ${p.distance}m</div>
            `;
            card.addEventListener('click', () => {
                status.textContent = `Selected: ${p.name} (${p.id})`;
                // Apply to LLMManager if available
                if (window._nexusLLM) {
                    window._nexusLLM.setModel(p.id).catch(() => {});
                }
            });
            grid.appendChild(card);
        });
    }

    async function checkBackend() {
        try {
            const r = await fetch(`${BASE}/api/vessel/personas`, { signal: AbortSignal.timeout(2000) });
            if (r.ok) {
                connStatus.textContent = '● Connected';
                connStatus.style.color = '#2ecc71';
                const data = await r.json();
                status.textContent = `${data.length || 0} personas on backend`;
            }
        } catch (e) {
            connStatus.textContent = '● Local';
            connStatus.style.color = '#ffaa00';
            status.textContent = 'Backend offline — showing local personas';
        }
    }

    document.getElementById('persona-apply-btn')?.addEventListener('click', () => {
        const mbti = document.getElementById('persona-mbti-select').value;
        const diagnosis = document.getElementById('persona-diagnosis-input').value.trim();
        const parts = [];
        if (mbti) parts.push(`MBTI: ${mbti}`);
        if (diagnosis) parts.push(`Diagnosis: ${diagnosis}`);
        status.textContent = parts.length ? `Applied: ${parts.join(', ')}` : 'No changes to apply';
    });

    renderPersonas();
    checkBackend();
})();
</script>
