<div style="display: flex; flex-direction: row; height: 100%; width: 100%;">
    <!-- Left column for Info (Vertical Text) -->
    <div style="flex-shrink: 0; display: flex; flex-direction: row; align-items: flex-end; justify-content: flex-start; padding: 20px 10px; background: rgba(0,0,0,0.2); border-right: 1px solid var(--glass-border);">
        <h2 style="margin: 0; font-family: var(--font-display); font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; color: #fff; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap;">LINUX VM</h2>
        <p style="margin: 0 0 0 15px; font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; writing-mode: vertical-rl; transform: rotate(180deg);">
            WebAssembly Console
        </p>
    </div>

    <!-- Right column for Terminal iframe -->
    <div style="flex: 1; background: #000; overflow: hidden; position: relative;">
        <iframe 
            src="vendor/webvm/index.html" 
            style="width: 100%; height: 100%; border: none; outline: none;"
            allow="cross-origin-isolated"
        ></iframe>
    </div>
</div>
