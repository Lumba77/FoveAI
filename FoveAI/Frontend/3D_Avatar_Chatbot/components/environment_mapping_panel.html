<div style="display: flex; flex-direction: column; height: 100%; font-family: monospace;">
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">
        Map user environments — configure spatial anchors, room boundaries, and XR scene layout.
        <span style="color: var(--status-ok);" id="envmap-conn-status">● Checking...</span>
    </p>

    <!-- Environment Presets -->
    <div style="margin-bottom: 1rem;">
        <span style="font-size: 0.6rem; color: #ff007f; letter-spacing: 0.1em; display: block; margin-bottom: 6px;">ENVIRONMENT PRESET</span>
        <select id="envmap-preset-select" style="width: 100%; background: #02050a; color: #00f3ff; border: 1px solid rgba(0,243,255,0.2); border-radius: 4px; padding: 8px; font-family: monospace; margin-bottom: 8px;">
            <option value="default">Default Room</option>
            <option value="studio">Creative Studio</option>
            <option value="office">Professional Office</option>
            <option value="lounge">Relaxation Lounge</option>
            <option value="custom">Custom</option>
        </select>
    </div>

    <!-- Spatial Configuration -->
    <div style="background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 10px; margin-bottom: 1rem;">
        <div style="font-size: 0.6rem; color: #888; letter-spacing: 0.1em; margin-bottom: 8px;">SPATIAL BOUNDARIES</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div>
                <label style="font-size: 0.65rem; color: #888; display: block; margin-bottom: 2px;">Room Width (m)</label>
                <input type="number" id="envmap-room-width" value="4.0" min="1" max="20" step="0.5" style="width: 100%; background: #02050a; border: 1px solid rgba(0,243,255,0.2); color: #00f3ff; padding: 6px; border-radius: 3px; font-family: monospace;">
            </div>
            <div>
                <label style="font-size: 0.65rem; color: #888; display: block; margin-bottom: 2px;">Room Depth (m)</label>
                <input type="number" id="envmap-room-depth" value="4.0" min="1" max="20" step="0.5" style="width: 100%; background: #02050a; border: 1px solid rgba(0,243,255,0.2); color: #00f3ff; padding: 6px; border-radius: 3px; font-family: monospace;">
            </div>
            <div>
                <label style="font-size: 0.65rem; color: #888; display: block; margin-bottom: 2px;">Room Height (m)</label>
                <input type="number" id="envmap-room-height" value="3.0" min="1" max="10" step="0.5" style="width: 100%; background: #02050a; border: 1px solid rgba(0,243,255,0.2); color: #00f3ff; padding: 6px; border-radius: 3px; font-family: monospace;">
            </div>
            <div>
                <label style="font-size: 0.65rem; color: #888; display: block; margin-bottom: 2px;">Floor Y Offset</label>
                <input type="number" id="envmap-floor-y" value="0.0" min="-5" max="5" step="0.1" style="width: 100%; background: #02050a; border: 1px solid rgba(0,243,255,0.2); color: #00f3ff; padding: 6px; border-radius: 3px; font-family: monospace;">
            </div>
        </div>
    </div>

    <!-- Anchor Points -->
    <div style="background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 10px; margin-bottom: 1rem;">
        <div style="font-size: 0.6rem; color: #888; letter-spacing: 0.1em; margin-bottom: 8px;">ANCHOR POINTS</div>
        <div id="envmap-anchors-list" style="display: flex; flex-direction: column; gap: 4px; font-size: 0.7rem;">
            <div style="display: flex; align-items: center; gap: 8px; padding: 6px; background: rgba(0,243,255,0.05); border-radius: 3px;">
                <span style="color: #00f3ff;">●</span>
                <span style="flex: 1; color: #ccc;">Home Position</span>
                <span style="color: #888;">(0, 0, 0)</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; padding: 6px; background: rgba(57,255,20,0.05); border-radius: 3px;">
                <span style="color: #39ff14;">●</span>
                <span style="flex: 1; color: #ccc;">Avatar Spawn</span>
                <span style="color: #888;">(0, 0, 2)</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; padding: 6px; background: rgba(255,0,127,0.05); border-radius: 3px;">
                <span style="color: #ff007f;">●</span>
                <span style="flex: 1; color: #ccc;">User Viewpoint</span>
                <span style="color: #888;">(0, 1.6, -3)</span>
            </div>
        </div>
        <button id="envmap-add-anchor-btn" style="width: 100%; margin-top: 8px; padding: 6px; background: rgba(0,243,255,0.1); border: 1px dashed rgba(0,243,255,0.3); color: #00f3ff; border-radius: 3px; cursor: pointer; font-family: monospace; font-size: 0.7rem;">+ ADD ANCHOR</button>
    </div>

    <!-- Action Buttons -->
    <div style="display: flex; gap: 8px; margin-top: auto;">
        <button class="primary-btn" style="flex: 1; background: rgba(0,243,255,0.1); border-color: #00f3ff; color: #00f3ff;" id="envmap-apply-btn">APPLY CONFIG</button>
        <button class="primary-btn" style="flex: 1; background: rgba(57,255,20,0.1); border-color: #39ff14; color: #39ff14;" id="envmap-save-btn">SAVE TO BACKEND</button>
    </div>
</div>

<script>
(function() {
    const presetSelect = document.getElementById('envmap-preset-select');
    const roomWidth = document.getElementById('envmap-room-width');
    const roomDepth = document.getElementById('envmap-room-depth');
    const roomHeight = document.getElementById('envmap-room-height');
    const floorY = document.getElementById('envmap-floor-y');

    const PRESETS = {
        default: { width: 4.0, depth: 4.0, height: 3.0, floorY: 0.0 },
        studio: { width: 6.0, depth: 5.0, height: 3.5, floorY: 0.0 },
        office: { width: 5.0, depth: 4.0, height: 2.8, floorY: 0.0 },
        lounge: { width: 4.5, depth: 4.5, height: 3.0, floorY: 0.0 },
        custom: null
    };

    presetSelect?.addEventListener('change', () => {
        const preset = PRESETS[presetSelect.value];
        if (preset) {
            roomWidth.value = preset.width;
            roomDepth.value = preset.depth;
            roomHeight.value = preset.height;
            floorY.value = preset.floorY;
        }
    });

    document.getElementById('envmap-apply-btn')?.addEventListener('click', () => {
        const config = {
            width: parseFloat(roomWidth.value),
            depth: parseFloat(roomDepth.value),
            height: parseFloat(roomHeight.value),
            floorY: parseFloat(floorY.value)
        };
        // Apply to ViewerEngine if available
        const viewer = window.NEXUS_VIEWER;
        if (viewer && viewer.setEnvironmentBounds) {
            viewer.setEnvironmentBounds(config);
        }
        // Dispatch event for other components
        window.dispatchEvent(new CustomEvent('environment_config_changed', { detail: config }));
        if (window.showMessage) {
            window.showMessage('Environment configuration applied.', 'success');
        }
    });

    document.getElementById('envmap-save-btn')?.addEventListener('click', async () => {
        const config = {
            width: parseFloat(roomWidth.value),
            depth: parseFloat(roomDepth.value),
            height: parseFloat(roomHeight.value),
            floorY: parseFloat(floorY.value)
        };
        try {
            const r = await fetch('/api/environment/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            });
            if (r.ok) {
                if (window.showMessage) window.showMessage('Environment saved to backend.', 'success');
            } else {
                throw new Error('HTTP ' + r.status);
            }
        } catch (e) {
            if (window.showMessage) window.showMessage('Failed to save environment config.', 'error');
        }
    });

    document.getElementById('envmap-add-anchor-btn')?.addEventListener('click', () => {
        const name = prompt('Enter anchor name:');
        if (!name) return;
        const x = parseFloat(prompt('X position:') || '0');
        const y = parseFloat(prompt('Y position:') || '0');
        const z = parseFloat(prompt('Z position:') || '0');
        const list = document.getElementById('envmap-anchors-list');
        if (list) {
            const div = document.createElement('div');
            div.style.cssText = 'display:flex; align-items:center; gap:8px; padding:6px; background:rgba(255,170,0,0.05); border-radius:3px;';
            div.innerHTML = `<span style="color:#ffaa00;">●</span><span style="flex:1; color:#ccc;">${name}</span><span style="color:#888;">(${x}, ${y}, ${z})</span>`;
            list.appendChild(div);
        }
    });
})();
</script>
