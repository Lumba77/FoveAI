<div>
    <p style="font-size:0.75rem; opacity:0.7; margin:0 0 12px 0;">
        Proxies to the Creativity Service (port 8003) to generate imagery.
        First GPU load can take several minutes.
        <span id="imagine-creativity-conn" style="color: #ff4444; margin-left: 8px;">■ offline</span>
    </p>
    
    <label for="dream-prompt" style="display:block; font-size:0.75rem; color: var(--text-secondary); margin-bottom:6px;">Prompt</label>
    <textarea id="dream-prompt" rows="3" class="text-input" style="width:100%; box-sizing:border-box; resize:vertical; margin-bottom:12px;" placeholder="Describe the image…"></textarea>
    
    <div id="dream-image-panel" style="margin-bottom:12px; padding: 10px; background: rgba(0, 0, 0, 0.2); border-radius: var(--border-radius-sm); border: 1px solid var(--glass-border);">
        <label style="font-size:0.75rem; color: var(--text-secondary);">Source Image (Optional)</label>
        <p style="font-size:0.65rem; opacity:0.6; margin:4px 0 8px 0;">
            Upload an image for img2img or ControlNet processing.
        </p>
        <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
            <input type="file" id="dream-file-input" accept="image/*" style="font-size:0.75rem; flex: 1;">
            <button type="button" class="secondary-btn" style="padding:4px 10px; font-size:0.75rem;" onclick="dreamClearUploadedImage()">CLEAR</button>
        </div>
        <img id="dream-src-preview" alt="Source preview" style="display:none; max-width:100%; max-height:180px; margin-top:10px; border-radius:6px; border:1px solid var(--border); object-fit:contain;">
    </div>
    
    <label for="dream-mode" style="font-size:0.75rem; color: var(--text-secondary);">Generation Mode</label>
    <select id="dream-mode" class="select-input" style="width: 100%; margin-top: 6px; margin-bottom: 12px;">
        <option value="turbo">Turbo (Fast SDXL)</option>
        <option value="control">ControlNet</option>
        <option value="enhance">Enhance/Upscale</option>
    </select>

    <!-- Generation Parameters -->
    <div style="margin-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span style="font-size: 0.7rem; color: #888; min-width: 60px;">Steps</span>
            <input type="range" id="dream-steps" min="4" max="50" step="1" value="20" style="flex: 1;">
            <span style="font-size: 0.7rem; color: #00f3ff; min-width: 30px;" id="dream-steps-val">20</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span style="font-size: 0.7rem; color: #888; min-width: 60px;">Guidance</span>
            <input type="range" id="dream-guidance" min="1" max="20" step="0.5" value="7.5" style="flex: 1;">
            <span style="font-size: 0.7rem; color: #ff007f; min-width: 30px;" id="dream-guidance-val">7.5</span>
        </div>
    </div>
    
    <button class="primary-btn" style="width: 100%; margin-top: 1rem;" id="generate-image-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        GENERATE DREAM
    </button>

    <!-- Result Display -->
    <div id="dream-result" style="display: none; margin-top: 12px; text-align: center;">
        <img id="dream-result-img" alt="Generated image" style="max-width: 100%; max-height: 300px; border-radius: 8px; border: 1px solid rgba(0,243,255,0.3);">
        <div style="margin-top: 8px; display: flex; gap: 8px; justify-content: center;">
            <button class="secondary-btn" style="font-size: 0.7rem; padding: 4px 8px;" onclick="dreamDownloadResult()">💾 Download</button>
            <button class="secondary-btn" style="font-size: 0.7rem; padding: 4px 8px;" onclick="dreamClearResult()">✕ Clear</button>
        </div>
    </div>

    <div id="imagine-creativity-status" style="margin-top: 10px; font-size: 0.75rem; color: var(--primary); text-align: center;"></div>
</div>

<script>
    // Component logic injected when the window is opened
    function dreamClearUploadedImage() {
        const fileInput = document.getElementById('dream-file-input');
        const preview = document.getElementById('dream-src-preview');
        if (fileInput) fileInput.value = '';
        if (preview) preview.style.display = 'none';
    }

    function dreamDownloadResult() {
        const img = document.getElementById('dream-result-img');
        if (img && img.src) {
            const a = document.createElement('a');
            a.href = img.src;
            a.download = 'lumax_dream.png';
            a.click();
        }
    }

    function dreamClearResult() {
        const result = document.getElementById('dream-result');
        const img = document.getElementById('dream-result-img');
        if (result) result.style.display = 'none';
        if (img) img.src = '';
    }

    // Slider value displays
    document.getElementById('dream-steps')?.addEventListener('input', (e) => {
        document.getElementById('dream-steps-val').textContent = e.target.value;
    });
    document.getElementById('dream-guidance')?.addEventListener('input', (e) => {
        document.getElementById('dream-guidance-val').textContent = e.target.value;
    });

    const fileInput = document.getElementById('dream-file-input');
    if (fileInput) {
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const preview = document.getElementById('dream-src-preview');
                    if (preview) {
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                    }
                };
                reader.readAsDataURL(file);
            }
        });
    }

    // Check creativity service health
    async function checkCreativityHealth() {
        const el = document.getElementById('imagine-creativity-conn');
        if (!el) return;
        try {
            const r = await fetch('/api/health-proxy/8003', { signal: AbortSignal.timeout(2000) });
            const data = await r.json();
            const alive = data.ok;
            el.textContent = alive ? '● online' : '■ offline';
            el.style.color = alive ? '#2ecc71' : '#ff4444';
        } catch {
            el.textContent = '■ offline';
            el.style.color = '#ff4444';
        }
    }

    const genBtn = document.getElementById('generate-image-btn');
    if (genBtn) {
        genBtn.addEventListener('click', async () => {
            const status = document.getElementById('imagine-creativity-status');
            const prompt = document.getElementById('dream-prompt').value;
            if (!prompt) {
                status.style.color = 'var(--status-error)';
                status.innerText = 'Please enter a prompt first.';
                return;
            }

            const mode = document.getElementById('dream-mode').value;
            const steps = parseInt(document.getElementById('dream-steps').value);
            const guidance = parseFloat(document.getElementById('dream-guidance').value);

            status.style.color = 'var(--status-listening)';
            status.innerText = 'Generating... (this may take a minute)';

            try {
                const payload = {
                    prompt: prompt,
                    mode: mode,
                    steps: steps,
                    guidance_scale: guidance
                };

                // Check if source image is uploaded
                const preview = document.getElementById('dream-src-preview');
                if (preview && preview.style.display !== 'none' && preview.src) {
                    payload.source_image = preview.src;
                }

                const r = await fetch('/api/proxy/8003/api/dreamscape/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: AbortSignal.timeout(120000) // 2 min timeout for GPU
                });

                if (r.ok) {
                    const data = await r.json();
                    const resultDiv = document.getElementById('dream-result');
                    const resultImg = document.getElementById('dream-result-img');
                    if (resultImg && data.image) {
                        resultImg.src = data.image; // base64 or URL
                        if (resultDiv) resultDiv.style.display = 'block';
                    }
                    status.style.color = 'var(--primary)';
                    status.innerText = '✓ Generation complete!';
                } else {
                    const errText = await r.text();
                    throw new Error(`HTTP ${r.status}: ${errText}`);
                }
            } catch (e) {
                status.style.color = 'var(--status-error)';
                status.innerText = `✗ Generation failed: ${e.message}`;
            }
        });
    }

    // Initial health check
    checkCreativityHealth();
    setInterval(checkCreativityHealth, 15000);
</script>
