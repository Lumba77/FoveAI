<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LUMAX Companion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; font-family: 'Segoe UI', system-ui, sans-serif; }
  
  #app { display: flex; flex-direction: column; height: 100vh; }
  
  /* ── Avatar Area ──────────────────────────────────── */
  #avatar-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: radial-gradient(ellipse at center, #0f1922 0%, #050810 100%);
    min-height: 0;
  }
  
  #avatar-canvas {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #1a3a4a, #0a1a2a 60%, #050a10);
    border: 2px solid #0a3a5a;
    box-shadow: 0 0 20px rgba(0, 200, 255, 0.15), inset 0 0 30px rgba(0, 100, 150, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }
  
  #avatar-canvas.listening {
    border-color: #0fa;
    box-shadow: 0 0 30px rgba(0, 255, 170, 0.3), inset 0 0 30px rgba(0, 200, 120, 0.15);
  }
  
  #avatar-canvas.speaking {
    border-color: #08f;
    box-shadow: 0 0 30px rgba(0, 136, 255, 0.3), inset 0 0 30px rgba(0, 100, 200, 0.15);
    animation: pulse 1.5s ease-in-out infinite;
  }
  
  #avatar-canvas.thinking {
    border-color: #fa0;
    box-shadow: 0 0 30px rgba(255, 170, 0, 0.2), inset 0 0 30px rgba(200, 130, 0, 0.1);
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  
  /* SVG avatar face */
  .face { width: 120px; height: 120px; }
  .eye { fill: #0fa; transition: all 0.2s; }
  .eye.blink { transform: scaleY(0.1); transform-origin: center; }
  .mouth { fill: none; stroke: #0fa; stroke-width: 2; stroke-linecap: round; transition: all 0.15s; }
  .mouth.speaking { stroke: #08f; }
  
  /* ── Status text ──────────────────────────────────── */
  #status-text {
    position: absolute;
    bottom: 8px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: #4a6a7a;
    letter-spacing: 0.5px;
  }
  
  /* ── Controls Bar ─────────────────────────────────── */
  #controls {
    display: flex;
    gap: 6px;
    padding: 8px;
    background: #0a0e14;
    border-top: 1px solid #1a2a3a;
    justify-content: center;
  }
  
  .btn {
    background: #0f1922;
    border: 1px solid #1a3a4a;
    color: #4a8aaa;
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    justify-content: center;
  }
  
  .btn:hover { background: #142028; border-color: #2a5a7a; color: #6abaca; }
  
  .btn.active {
    background: #0a2a1a;
    border-color: #0fa;
    color: #0fa;
  }
  
  .btn.end-call {
    background: #2a0a0a;
    border-color: #f44;
    color: #f88;
  }
  
  .btn-icon { font-size: 16px; }
  
  /* ── Subtitle area ────────────────────────────────── */
  #subtitle {
    padding: 6px 10px;
    font-size: 11px;
    color: #6a8aaa;
    background: #08101a;
    min-height: 28px;
    max-height: 50px;
    overflow: hidden;
    text-align: center;
    line-height: 1.3;
  }
</style>
</head>
<body>
<div id="app">
  <div id="avatar-area">
    <div id="avatar-canvas">
      <svg class="face" viewBox="0 0 120 120">
        <ellipse class="eye" id="eye-left" cx="42" cy="48" rx="5" ry="7"/>
        <ellipse class="eye" id="eye-right" cx="78" cy="48" rx="5" ry="7"/>
        <path class="mouth" id="mouth" d="M 45 75 Q 60 80 75 75" fill="none"/>
      </svg>
    </div>
    <div id="status-text">Tap Start to begin</div>
  </div>
  
  <div id="subtitle"></div>
  
  <div id="controls">
    <button class="btn" id="call-btn" onclick="toggleCall()">
      <span class="btn-icon">📞</span> Start Conversation
    </button>
  </div>
</div>

<script>
// Auto-detect API host: use the same host that served this page,
// falling back to localhost for direct dev access.
const API = window.location.protocol + '//' + window.location.hostname + ':8400';

const COMPANION_SYSTEM_PROMPT = `You are a voice companion. The user is talking to you via voice in a continuous conversation. Respond conversationally and naturally — as if on a phone call. Never say your own name or introduce yourself — just talk directly like you're already mid-conversation. Keep replies short (1-3 sentences) since they will be spoken aloud via TTS. Always respond in English only. Do not output metadata, keywords, themes, structured data, or thinking tags. Just talk like a friendly, helpful assistant on a video call.`;

// ── TTS text normalization ───────────────────────────
function normalizeForTTS(text) {
  return text
    // Catch "L-U-M-A-X" or "L. U. M. A. X." spelled-out patterns
    .replace(/L[-.\s]*U[-.\s]*M[-.\s]*A[-.\s]*X/gi, 'Loomax')
    // Catch the word LUMAX itself
    .replace(/\bLUMAX\b/gi, 'Loomax')
    // Convert all-caps words (2+ chars) to title case so TTS reads them as words
    .replace(/\b[A-Z]{2,}\b/g, (m) => m.charAt(0) + m.slice(1).toLowerCase())
    // Remove CJK / Japanese / Korean / Cyrillic characters that Kokoro can't pronounce
    .replace(/[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af\u0400-\u04ff]+/g, '')
    // Remove emoji and special symbols
    .replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}]/gu, '')
    // Remove leftover isolated single letters like "L." "U." etc.
    .replace(/\b[A-Z]\.\s*/g, '')
    // Clean up multiple spaces/newlines left by removals
    .replace(/\s+/g, ' ')
    .trim();
}

// ── DOM refs ─────────────────────────────────────────
const avatar = document.getElementById('avatar-canvas');
const statusText = document.getElementById('status-text');
const subtitle = document.getElementById('subtitle');
const callBtn = document.getElementById('call-btn');
const mouth = document.getElementById('mouth');
const eyeLeft = document.getElementById('eye-left');
const eyeRight = document.getElementById('eye-right');

// ── State machine ────────────────────────────────────
// States: idle → listening → thinking → speaking → listening (loop) → idle (timeout)
let callState = 'idle';
let conversationActive = false;
let currentAudio = null;
let silenceTimer = null;
const SILENCE_TIMEOUT = 45000; // 45s of no speech → end conversation

function setCallState(newState) {
  callState = newState;
  console.log('[Companion] State:', newState);
  
  avatar.classList.remove('listening', 'speaking', 'thinking');
  
  switch (newState) {
    case 'idle':
      statusText.textContent = conversationActive ? 'Paused' : 'Tap Start to begin';
      callBtn.innerHTML = conversationActive
        ? '<span class="btn-icon">📞</span> Resume'
        : '<span class="btn-icon">📞</span> Start Conversation';
      callBtn.classList.remove('active', 'end-call');
      break;
    case 'listening':
      avatar.classList.add('listening');
      statusText.textContent = 'Listening…';
      callBtn.innerHTML = '<span class="btn-icon">📴</span> End Call';
      callBtn.classList.add('end-call');
      callBtn.classList.remove('active');
      break;
    case 'thinking':
      avatar.classList.add('thinking');
      statusText.textContent = 'Thinking…';
      callBtn.innerHTML = '<span class="btn-icon">⏳</span> Thinking…';
      callBtn.classList.remove('end-call');
      break;
    case 'speaking':
      avatar.classList.add('speaking');
      statusText.textContent = 'Speaking…';
      callBtn.innerHTML = '<span class="btn-icon">🔊</span> Speaking…';
      callBtn.classList.remove('end-call');
      break;
  }
}

// ── Blink animation ──────────────────────────────────
setInterval(() => {
  if (callState === 'speaking') return;
  eyeLeft.classList.add('blink');
  eyeRight.classList.add('blink');
  setTimeout(() => { eyeLeft.classList.remove('blink'); eyeRight.classList.remove('blink'); }, 150);
}, 4000);

// ── Mouth animation during speech ────────────────────
function animateMouth() {
  if (!currentAudio || currentAudio.paused) {
    mouth.setAttribute('d', 'M 45 75 Q 60 80 75 75');
    mouth.classList.remove('speaking');
    return;
  }
  const open = 2 + Math.random() * 6;
  mouth.setAttribute('d', `M 45 75 Q 60 ${75 + open} 75 75`);
  mouth.classList.add('speaking');
  requestAnimationFrame(animateMouth);
}

// ── Web Speech API for STT ───────────────────────────
let recognition = null;
let recognitionActive = false;
let currentTranscript = '';     // Accumulated text from current utterance
let silenceDetectTimer = null;  // Timer for detecting end of speech
let lastInterimTime = 0;
const SILENCE_DELAY = 2500;     // 2.5s of no new speech → treat as end of utterance

function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    subtitle.textContent = 'Web Speech API not available in this browser';
    return false;
  }
  
  recognition = new SpeechRecognition();
  recognition.continuous = false;  // Each session = one utterance, auto-stops on pause
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.maxAlternatives = 1;
  
  recognition.onresult = (event) => {
    resetSilenceTimer();
    lastInterimTime = Date.now();
    
    let interim = '';
    let final = '';
    
    for (let i = 0; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        final += transcript;
      } else {
        interim += transcript;
      }
    }
    
    // Accumulate final results (in case there are multiple)
    if (final) currentTranscript += final;
    
    // Show live transcription
    const display = (currentTranscript + interim).trim();
    if (display) {
      subtitle.textContent = 'You: ' + display;
    }
    
    // Start silence detection — if no new results for 1.5s, send what we have
    if (silenceDetectTimer) clearTimeout(silenceDetectTimer);
    if (display) {
      silenceDetectTimer = setTimeout(() => {
        const text = (currentTranscript + interim).trim();
        if (text && callState === 'listening') {
          console.log('[Companion] Silence detected, sending:', text);
          currentTranscript = '';
          pauseRecognition();
          sendTextToModel(text);
        }
      }, SILENCE_DELAY);
    }
  };
  
  recognition.onerror = (event) => {
    console.error('[Companion] STT error:', event.error);
    if (event.error === 'no-speech') return;
    if (event.error === 'aborted') return;
    if (event.error === 'not-allowed') {
      subtitle.textContent = 'Microphone access denied';
      endConversation();
    }
  };
  
  recognition.onend = () => {
    console.log('[Companion] Recognition session ended');
    // Clear any pending silence timer
    if (silenceDetectTimer) { clearTimeout(silenceDetectTimer); silenceDetectTimer = null; }
    
    // If we accumulated text, send it
    if (currentTranscript.trim() && callState === 'listening') {
      const text = currentTranscript.trim();
      currentTranscript = '';
      pauseRecognition();
      sendTextToModel(text);
      return;
    }
    
    // Auto-restart if still in listening state (conversation continues)
    if (recognitionActive && callState === 'listening') {
      setTimeout(() => {
        if (recognitionActive && callState === 'listening') {
          try { recognition.start(); } catch (e) {
            console.warn('[Companion] Restart failed:', e);
            setTimeout(() => {
              if (recognitionActive && callState === 'listening') {
                try { recognition.start(); } catch (e2) {}
              }
            }, 500);
          }
        }
      }, 200);
    }
  };
  
  return true;
}

function startRecognition() {
  if (!recognition) return;
  recognitionActive = true;
  currentTranscript = '';
  try { recognition.start(); } catch (e) { console.warn('[Companion] Start failed:', e); }
}

function pauseRecognition() {
  recognitionActive = false;
  if (silenceDetectTimer) { clearTimeout(silenceDetectTimer); silenceDetectTimer = null; }
  if (recognition) {
    try { recognition.stop(); } catch (e) {}
  }
}

function resumeRecognition() {
  if (callState !== 'listening') return;
  recognitionActive = true;
  currentTranscript = '';
  setTimeout(() => {
    if (recognitionActive && callState === 'listening' && recognition) {
      try { recognition.start(); } catch (e) {
        if (e.message !== 'recognition has already started') {
          console.warn('[Companion] Resume failed:', e);
        }
      }
    }
  }, 300);
  resetSilenceTimer();
}

// ── Silence timer ────────────────────────────────────
function resetSilenceTimer() {
  if (silenceTimer) clearTimeout(silenceTimer);
  if (conversationActive && callState === 'listening') {
    silenceTimer = setTimeout(() => {
      console.log('[Companion] Silence timeout — ending conversation');
      subtitle.textContent = '(Conversation ended — too quiet)';
      endConversation();
    }, SILENCE_TIMEOUT);
  }
}

function clearSilenceTimer() {
  if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
}

// ── Conversation control ─────────────────────────────
async function toggleCall() {
  if (conversationActive) {
    endConversation();
  } else {
    await startConversation();
  }
}

async function startConversation() {
  // Request mic permission first
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop()); // Just testing permission
  } catch (e) {
    subtitle.textContent = 'Microphone access denied';
    return;
  }
  
  if (!initRecognition()) return;
  
  conversationActive = true;
  subtitle.textContent = '';
  setCallState('listening');
  startRecognition();
  resetSilenceTimer();
}

function endConversation() {
  conversationActive = false;
  pauseRecognition();
  clearSilenceTimer();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  mouth.setAttribute('d', 'M 45 75 Q 60 80 75 75');
  mouth.classList.remove('speaking');
  setCallState('idle');
  callBtn.innerHTML = '<span class="btn-icon">📞</span> Start Conversation';
  callBtn.classList.remove('active', 'end-call');
}

// ── Send text to model, get reply, speak it ──────────
async function sendTextToModel(userText) {
  setCallState('thinking');
  
  try {
    const chatRes = await fetch(`${API}/v1/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'auto',
        messages: [
          { role: 'system', content: COMPANION_SYSTEM_PROMPT },
          { role: 'user', content: userText }
        ],
        stream: false,
        max_tokens: 200
      })
    });
    if (!chatRes.ok) throw new Error('Chat failed: ' + chatRes.status);
    const chatData = await chatRes.json();
    const reply = chatData.choices?.[0]?.message?.content || '';
    const cleanReply = reply.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/[*_#`]/g, '').trim();
    
    subtitle.textContent = cleanReply.slice(0, 150);
    
    if (cleanReply) {
      setCallState('speaking');
      const ttsText = normalizeForTTS(cleanReply);
      if (!ttsText) {
        console.warn('[Companion] Reply was empty after TTS normalization');
        if (conversationActive) { setCallState('listening'); resumeRecognition(); }
        else { setCallState('idle'); }
        return;
      }
      const ttsRes = await fetch(`${API}/api/tts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: ttsText }),
        signal: AbortSignal.timeout(30000)
      });
      if (ttsRes.ok) {
        const audioBlob = await ttsRes.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        currentAudio = new Audio(audioUrl);
        currentAudio.onplay = () => { animateMouth(); };
        currentAudio.onended = () => {
          mouth.setAttribute('d', 'M 45 75 Q 60 80 75 75');
          mouth.classList.remove('speaking');
          URL.revokeObjectURL(audioUrl);
          currentAudio = null;
          // Auto-resume listening after model finishes speaking
          if (conversationActive) {
            setCallState('listening');
            resumeRecognition();
          }
        };
        await currentAudio.play();
      } else {
        // TTS unavailable — show text, then resume listening
        console.error('[Companion] TTS failed:', ttsRes.status, await ttsRes.text().catch(() => ''));
        subtitle.textContent = cleanReply.slice(0, 150) + ' (TTS offline)';
        setTimeout(() => {
          if (conversationActive) {
            setCallState('listening');
            resumeRecognition();
          }
        }, 2000);
      }
    } else {
      // Empty reply — resume listening
      if (conversationActive) {
        setCallState('listening');
        resumeRecognition();
      }
    }
  } catch (e) {
    console.error('[Companion] sendTextToModel error:', e);
    subtitle.textContent = 'Error: ' + e.message;
    if (conversationActive) {
      setTimeout(() => {
        setCallState('listening');
        resumeRecognition();
      }, 2000);
    } else {
      setCallState('idle');
    }
  }
}

// ── Check voice pipeline on load ─────────────────────
(async () => {
  let ttsStatus = 'offline';
  let sttStatus = 'offline';
  try {
    const r = await fetch(`${API}/api/voice/status`, { signal: AbortSignal.timeout(5000) });
    if (r.ok) {
      const s = await r.json();
      ttsStatus = s.tts;
      sttStatus = s.stt;
      console.log('[Companion] Voice status:', s);
    } else {
      console.log('[Companion] Voice status HTTP', r.status);
    }
  } catch (e) {
    console.error('[Companion] Voice status fetch failed:', e);
  }
  
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    subtitle.textContent = 'Browser does not support speech recognition';
  } else if (ttsStatus === 'offline') {
    subtitle.textContent = 'TTS offline — replies will be text only';
  } else {
    subtitle.textContent = 'Ready — tap Start Conversation';
  }
})();
</script>
</body>
</html>
